<!doctype html>
<!-- PROTOTYPE — throwaway. Answers "What visual direction makes the site look premium while keeping the logo and orange?"
     Lives on branch prototype/visual-direction only. Open this file in a browser, or `python3 -m http.server` from repo root
     and visit /recipes/_prototype-visual-direction/?dir=label|garden|poster&r=pot-brownies|cannabutter&theme=light|dark&lang=en|zh -->
<html lang="en" data-dir="label" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>PROTOTYPE · visual direction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Unbounded:wght@500..800&display=swap">
<style>
/* ---------- shared base (not part of any direction) ---------- */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;padding-bottom:120px;transition:background-color .2s}
img{display:block;max-width:100%}
a{color:inherit}
button,input{font:inherit;color:inherit}
.wrap{max-width:680px;margin:0 auto;padding:0 20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.icon{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.check input{position:absolute;opacity:0;pointer-events:none}
.check{position:relative;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.btn{text-align:center;line-height:1.2}
.ad{display:flex;flex-direction:column;gap:6px;margin:40px 0}
.ad-box{min-height:280px;display:grid;place-items:center;font-size:14px}
details summary{cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- prototype switcher (deliberately off-brand) ---------- */
#bar{position:fixed;left:8px;right:8px;bottom:max(8px,env(safe-area-inset-bottom));z-index:99;background:#202124;color:#fff;border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;font:13px/1 -apple-system,system-ui,sans-serif;box-shadow:0 6px 24px rgba(0,0,0,.35);overflow:hidden}
#bar .grp{display:flex;background:#3c4043;border-radius:9px;padding:2px}
#bar button{border:0;background:none;color:#e8eaed;padding:9px 10px;border-radius:7px;cursor:pointer;white-space:nowrap}
#bar button[aria-pressed=true]{background:#fff;color:#202124;font-weight:600}
#bar .tag{color:#9aa0a6;align-self:center;padding:0 4px}

/* =====================================================================
   A · LABEL — "Dose facts". Archivo (one family, width axis). Ink = deep logo green.
   ===================================================================== */
[data-dir=label]{
  --paper:#ffffff; --ink:#10261a; --ink-2:#4a5d50; --orange:#f27242; --orange-text:#b8441a; --tint:#fff0e8; --leaf:#6e9f32; --line:#10261a; --soft:#d9dfda; --focus:#f27242;
}
[data-dir=label][data-theme=dark]{
  --paper:#0c1510; --ink:#e8eee9; --ink-2:#a3b2a7; --orange-text:#ff9168; --tint:#2a1810; --line:#e8eee9; --soft:#2a3a30;
}
[data-dir=label] body{background:var(--paper);color:var(--ink);font-family:Archivo,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;font-size:17px;line-height:1.55;font-variation-settings:"wdth" 100}
[data-dir=label] .cond{font-stretch:72%;font-variation-settings:"wdth" 72}
[data-dir=label] .hdr{display:flex;align-items:center;justify-content:space-between;height:64px;border-bottom:2px solid var(--line)}
[data-dir=label] .hdr .logo{height:34px;width:auto}
[data-dir=label][data-theme=dark] .hdr .logo{filter:brightness(1.15)}
[data-dir=label] .hdr .tools{display:flex}
[data-dir=label] .ibtn{width:44px;height:44px;display:grid;place-items:center;border:0;background:none;cursor:pointer}
[data-dir=label] .crumb{display:inline-block;font-weight:600;font-size:15px;color:var(--orange-text);text-decoration:none;padding:6px 0}
[data-dir=label] h1{font-weight:850;font-stretch:72%;font-variation-settings:"wdth" 72;font-size:52px;line-height:.92;letter-spacing:-.01em;margin:2px 0 12px}
[data-dir=label] .title-row{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;margin-top:16px}
[data-dir=label] .thumb{width:120px;height:80px;object-fit:cover;border:2px solid var(--line);flex:none;transform:rotate(2deg)}
[data-dir=label] .desc{margin:0 0 18px;font-size:18px;color:var(--ink-2)}
[data-dir=label] .meta{display:grid;grid-template-columns:repeat(3,1fr);margin:0 0 20px;border-top:2px solid var(--line);border-bottom:2px solid var(--line)}
[data-dir=label] .meta div{padding:8px 10px}
[data-dir=label] .meta div+div{border-left:1px solid var(--line)}
[data-dir=label] .meta dt{font-size:13px;color:var(--ink-2)}
[data-dir=label] .meta dd{margin:0;font-weight:700;font-size:18px}
[data-dir=label] .facts{border:3px solid var(--line);padding:12px 14px 14px}
[data-dir=label] .facts h2{margin:0;font-weight:900;font-stretch:72%;font-variation-settings:"wdth" 72;font-size:34px;line-height:1}
[data-dir=label] .facts .serving{margin:2px 0 8px;font-size:15px;border-bottom:10px solid var(--line);padding-bottom:6px}
[data-dir=label] .facts .big{display:flex;justify-content:space-between;align-items:baseline;border-bottom:4px solid var(--line);padding:2px 0 6px}
[data-dir=label] .facts .big span{font-weight:700}
[data-dir=label] .facts .big strong{font-weight:900;font-stretch:72%;font-variation-settings:"wdth" 72;font-size:58px;line-height:1;color:var(--orange-text)}
[data-dir=label] .facts .big strong small{font-size:26px}
[data-dir=label] .facts .row{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:6px 0;font-size:16px}
[data-dir=label] .facts .row b{font-weight:700}
[data-dir=label] .facts .begin{margin:10px 0 12px;font-size:15px;line-height:1.45}
[data-dir=label] .btn{display:flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 10px;font-stretch:85%;font-variation-settings:"wdth" 85;border:2px solid var(--line);background:none;font-weight:700;text-decoration:none;cursor:pointer;font-size:16px}
[data-dir=label] .btn.primary{background:var(--ink);color:var(--paper)}
[data-dir=label] .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
[data-dir=label] section.block{margin-top:44px}
[data-dir=label] .block>h2{font-weight:900;font-stretch:72%;font-variation-settings:"wdth" 72;font-size:34px;line-height:1;margin:0 0 4px;padding-top:10px;border-top:6px solid var(--line)}
[data-dir=label] .hint{margin:0 0 10px;font-size:15px;color:var(--ink-2)}
[data-dir=label] .calc .field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
[data-dir=label] .calc label{font-weight:700}
[data-dir=label] .calc label small{display:block;font-weight:400;font-size:14px;color:var(--ink-2)}
[data-dir=label] .stepper{display:flex;align-items:stretch;border:2px solid var(--line)}
[data-dir=label] .stepper button{width:48px;height:48px;border:0;background:none;font-size:24px;cursor:pointer}
[data-dir=label] .stepper input{width:64px;border:0;border-left:2px solid var(--line);border-right:2px solid var(--line);text-align:center;font-size:20px;font-weight:700;background:none}
[data-dir=label] .calc .out{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0;border-bottom:10px solid var(--line)}
[data-dir=label] .calc .out strong{font-size:44px;font-weight:900;font-stretch:72%;font-variation-settings:"wdth" 72;color:var(--orange-text);line-height:1}
[data-dir=label] .list{list-style:none;margin:0;padding:0}
[data-dir=label] .list li{border-bottom:1px solid var(--soft)}
[data-dir=label] .list .check{display:flex;gap:14px;padding:12px 0;align-items:flex-start;font-size:18px}
[data-dir=label] .box{width:24px;height:24px;border:2px solid var(--line);flex:none;margin-top:2px;display:grid;place-items:center}
[data-dir=label] .box .icon{width:16px;height:16px;stroke-width:3;opacity:0;color:var(--paper)}
[data-dir=label] .check input:checked~.box{background:var(--orange-text);border-color:var(--orange-text)}
[data-dir=label] .check input:checked~.box .icon{opacity:1}
[data-dir=label] .check input:checked~.txt{text-decoration:line-through;text-decoration-thickness:2px;color:var(--ink-2)}
[data-dir=label] .steps .num{font-weight:900;font-stretch:72%;font-variation-settings:"wdth" 72;font-size:40px;line-height:.9;width:36px;color:var(--orange-text);flex:none}
[data-dir=label] .steps input:checked~.num{color:var(--soft)}
[data-dir=label] .wake{margin-top:14px;width:100%}
[data-dir=label] .wake[aria-pressed=true]{background:var(--orange-text);border-color:var(--orange-text);color:#fff}
[data-dir=label] .ad-label{font-size:13px;color:var(--ink-2)}
[data-dir=label] .ad-box{border:1px dashed var(--ink-2);color:var(--ink-2)}
[data-dir=label] .tips li{padding:10px 0;border-bottom:1px solid var(--soft)}
[data-dir=label] .tips{margin:0;padding:0 0 0 20px}
[data-dir=label] details{border-bottom:1px solid var(--line)}
[data-dir=label] summary{padding:14px 0;font-weight:700;display:flex;justify-content:space-between;gap:12px}
[data-dir=label] summary::after{content:"+";font-size:26px;line-height:.8;font-weight:400}
[data-dir=label] details[open] summary::after{content:"−"}
[data-dir=label] details p{margin:0 0 14px;color:var(--ink-2)}
[data-dir=label] .rel{list-style:none;margin:0;padding:0}
[data-dir=label] .rel a{display:flex;gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--soft);text-decoration:none}
[data-dir=label] .rel .rt{width:72px;height:72px;flex:none;border:2px solid var(--line);object-fit:cover;display:grid;place-items:center;background:var(--tint)}
[data-dir=label] .rel .rt svg{width:44px;height:44px}
[data-dir=label] .rel b{display:block;font-size:20px;font-weight:800;font-stretch:80%;font-variation-settings:"wdth" 80;line-height:1.1}
[data-dir=label] .rel span{font-size:15px;color:var(--orange-text);font-weight:700}
[data-dir=label] .ftr{margin-top:56px;border-top:6px solid var(--line);padding:20px 0 30px;font-size:15px}
[data-dir=label] .ftr nav{display:grid;grid-template-columns:1fr 1fr}
[data-dir=label] .ftr nav a{padding:10px 0;text-decoration:none;font-weight:600}
[data-dir=label] .ftr p{color:var(--ink-2)}
[data-dir=label] .glyph-a{fill:var(--orange)} [data-dir=label] .glyph-b{fill:var(--ink)} [data-dir=label] .glyph-line{stroke:var(--ink)}
[data-dir=label] .bump{animation:bump .35s ease-out}
@keyframes bump{0%{transform:translateY(-4px);opacity:.4}100%{transform:none;opacity:1}}

/* =====================================================================
   B · GARDEN — system fonts only. Deep leaf canopy, orange for actions. Soft radii by hierarchy.
   ===================================================================== */
[data-dir=garden]{
  --paper:#f3f6f0; --surface:#ffffff; --canopy:#1d4a2c; --canopy-2:#2b6a3e; --ink:#15261b; --ink-2:#4d5f52; --orange:#f27242; --on-orange:#1b120c; --leaf:#8bc34a; --line:#dde6d7; --focus:#f27242;
}
[data-dir=garden][data-theme=dark]{
  --paper:#0d1611; --surface:#152219; --canopy:#11331d; --canopy-2:#1d4a2c; --ink:#e6eee7; --ink-2:#9fb1a4; --line:#24372a;
}
[data-dir=garden] body{background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;font-size:17px;line-height:1.5}
[data-dir=garden] .hdr{display:flex;align-items:center;justify-content:space-between;height:84px}

[data-dir=garden] .hdr .tools{display:flex;gap:4px}
[data-dir=garden] .ibtn{width:44px;height:44px;display:grid;place-items:center;border:0;border-radius:50%;background:var(--surface);cursor:pointer}
[data-dir=garden] .cover{position:relative;border-radius:28px;overflow:hidden;background:var(--canopy);color:#fff;height:250px;margin-top:4px}
[data-dir=garden] .cover>img{width:100%;height:100%;object-fit:cover}

[data-dir=garden] .cover .pattern{position:absolute;inset:0;width:100%;height:100%}

[data-dir=garden] .cover-text{position:absolute;left:20px;right:20px;bottom:18px;z-index:1}
[data-dir=garden] .crumb{display:inline-block;font-size:14px;font-weight:600;color:var(--leaf);text-decoration:none;padding:4px 0}
[data-dir=garden] h1{font-size:36px;line-height:1.05;letter-spacing:-.025em;font-weight:800;margin:0}
[data-dir=garden] .desc{margin:16px 2px 12px;color:var(--ink-2)}
[data-dir=garden] .meta{display:flex;gap:8px;flex-wrap:wrap;list-style:none;margin:0 0 14px;padding:0}
[data-dir=garden] .meta li{display:flex;gap:6px;align-items:center;background:var(--surface);border-radius:999px;padding:7px 12px;font-size:15px;font-weight:600}
[data-dir=garden] .meta .icon{width:18px;height:18px;color:var(--canopy-2)}
[data-dir=garden][data-theme=dark] .meta .icon{color:var(--leaf)}
[data-dir=garden] .dose{background:var(--surface);border-radius:20px;padding:16px}
[data-dir=garden] .dose .nums{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
[data-dir=garden] .dose strong{display:block;font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1;color:var(--canopy-2)}
[data-dir=garden][data-theme=dark] .dose strong{color:var(--leaf)}
[data-dir=garden] .dose strong small{font-size:22px}
[data-dir=garden] .dose .lbl{font-size:14px;color:var(--ink-2)}
[data-dir=garden] .dose .whole{text-align:right}
[data-dir=garden] .dose .whole b{display:block;font-size:20px}
[data-dir=garden] .begin{display:flex;gap:10px;align-items:flex-start;margin:14px 0 0;padding:12px;border-radius:14px;background:color-mix(in srgb,var(--leaf) 16%,transparent);font-size:15px;line-height:1.4}
[data-dir=garden] .begin .icon{color:var(--canopy-2);margin-top:1px}
[data-dir=garden][data-theme=dark] .begin .icon{color:var(--leaf)}
[data-dir=garden] .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
[data-dir=garden] .btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;border-radius:999px;border:0;background:color-mix(in srgb,var(--canopy-2) 12%,var(--surface));font-weight:700;text-decoration:none;cursor:pointer;font-size:16px}
[data-dir=garden] .btn.primary{background:var(--orange);color:var(--on-orange)}
[data-dir=garden] section.block{margin-top:32px;background:var(--surface);border-radius:20px;padding:18px 16px}
[data-dir=garden] .block>h2{font-size:24px;letter-spacing:-.02em;margin:0 0 2px}
[data-dir=garden] .hint{margin:0 0 10px;font-size:15px;color:var(--ink-2)}
[data-dir=garden] .calc .field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0}
[data-dir=garden] .calc label{font-weight:700}
[data-dir=garden] .calc label small{display:block;font-weight:400;font-size:14px;color:var(--ink-2)}
[data-dir=garden] .stepper{display:flex;align-items:center;gap:4px;background:var(--paper);border-radius:999px;padding:4px}
[data-dir=garden] .stepper button{width:44px;height:44px;border-radius:50%;border:0;background:var(--surface);font-size:22px;cursor:pointer}
[data-dir=garden] .stepper input{width:56px;border:0;text-align:center;font-size:19px;font-weight:700;background:none}
[data-dir=garden] .calc .out{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding:14px 16px;border-radius:14px;background:var(--canopy);color:#fff}
[data-dir=garden] .calc .out strong{font-size:34px;font-weight:800;letter-spacing:-.03em}
[data-dir=garden] .list{list-style:none;margin:0;padding:0}
[data-dir=garden] .list li+li{border-top:1px solid var(--line)}
[data-dir=garden] .list .check{display:flex;gap:14px;padding:13px 0;align-items:flex-start;font-size:18px}
[data-dir=garden] .box{width:26px;height:26px;border-radius:50%;border:2px solid var(--canopy-2);flex:none;display:grid;place-items:center;transition:background-color .15s,transform .15s}
[data-dir=garden][data-theme=dark] .box{border-color:var(--leaf)}

[data-dir=garden] .check input:checked~.box .icon{opacity:1}
[data-dir=garden] .check input:checked~.txt{text-decoration:line-through;color:var(--ink-2)}
[data-dir=garden] .steps .num{width:32px;height:32px;border-radius:50%;background:var(--canopy);color:#fff;display:grid;place-items:center;font-weight:700;font-size:16px;flex:none}
[data-dir=garden] .steps input:checked~.num{background:var(--line);color:var(--ink-2)}
[data-dir=garden] .wake{margin-top:12px;width:100%}
[data-dir=garden] .wake[aria-pressed=true]{background:var(--canopy);color:#fff}
[data-dir=garden] .ad-label{font-size:13px;color:var(--ink-2);padding-left:4px}
[data-dir=garden] .ad-box{border-radius:20px;background:var(--surface);color:var(--ink-2)}
[data-dir=garden] .tips{margin:0;padding:0 0 0 20px}
[data-dir=garden] .tips li{padding:6px 0}
[data-dir=garden] details+details{border-top:1px solid var(--line)}
[data-dir=garden] summary{padding:14px 0;font-weight:700;display:flex;justify-content:space-between;gap:12px}
[data-dir=garden] summary::after{content:"";width:10px;height:10px;border-right:2px solid;border-bottom:2px solid;transform:rotate(45deg);margin-top:4px;flex:none;transition:transform .2s}

[data-dir=garden] details p{margin:0 0 14px;color:var(--ink-2)}
[data-dir=garden] .rel{display:flex;gap:12px;overflow-x:auto;list-style:none;margin:0 -16px;padding:2px 16px 4px;scroll-snap-type:x mandatory}
[data-dir=garden] .rel li{flex:0 0 62%;scroll-snap-align:start}

[data-dir=garden] .rel .rt{height:130px;border-radius:16px;overflow:hidden;background:var(--canopy);position:relative;display:grid;place-items:center}

[data-dir=garden] .rel span{font-size:14px;color:var(--ink-2)}
[data-dir=garden] .ftr{margin-top:40px;background:var(--canopy);color:#e6eee7;padding:24px 0 30px;font-size:15px}
[data-dir=garden] .ftr nav{display:grid;grid-template-columns:1fr 1fr}
[data-dir=garden] .ftr nav a{padding:10px 0;text-decoration:none;font-weight:600}
[data-dir=garden] .ftr p{color:#a9c2ae}
[data-dir=garden] .glyph-a{fill:var(--orange)} [data-dir=garden] .glyph-b{fill:#f5efe6} [data-dir=garden] .glyph-line{stroke:#1d4a2c}

/* =====================================================================
   C · POSTER — Unbounded display (echoes the chunky wordmark) + system body. Category colour-block covers.
   ===================================================================== */
[data-dir=poster]{
  --paper:#ffffff; --ink:#1f1410; --ink-2:#6a5a50; --orange:#f27242; --on-cat:#1f1410; --line:#ecdfd6; --chip:#f6eee9; --focus:#1f1410;
}
[data-dir=poster][data-theme=dark]{
  --paper:#191210; --ink:#f7ede6; --ink-2:#bba89b; --line:#3a2c26; --chip:#2a1f1b; --focus:#f27242;
}
[data-dir=poster] body{background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;font-size:17px;line-height:1.55}
[data-dir=poster] .disp{font-family:Unbounded,"PingFang SC","Hiragino Sans GB","Noto Sans SC",sans-serif}
[data-dir=poster] .hdr{display:flex;align-items:center;justify-content:space-between;height:64px}
[data-dir=poster] .hdr .logo{height:32px;width:auto}
[data-dir=poster] .hdr .tools{display:flex}

// ---------------- state (URL is the state) ----------------
const P = new URLSearchParams(location.search);
const S = { dir: P.get("dir") || "label", r: P.get("r") || "pot-brownies", theme: P.get("theme") || "light", lang: P.get("lang") || "en" };
let calc = null;

const dose = (q, pct, n) => (10 * q * pct) / n;
const fmt = (x) => (x >= 10 ? Math.round(x) : Math.round(x * 10) / 10).toString();

function page() {
  const R = RECIPES[S.r], L = R[S.lang], t = T[S.lang], c = CAT[R.cat], d = S.dir;
  const [u1, uN] = R.unit[S.lang];
  const g = calc || { q: R.q, pct: R.pct, n: R.n };
  const per = dose(g.q, g.pct, g.n), total = 10 * g.q * g.pct;
  const catName = c[S.lang];
  const photo = R.photo ? IMG + "recipes/" + R.photo : null;
  const glyph = GLYPH[c.glyph];
  const begin = t.begin(t.frac(5 / per, u1));
  const hdr = `<header class="hdr"><a href="#" aria-label="HowToEdibles home"><img class="logo" src="${IMG}howtoedibleslogo.png" alt="HowToEdibles" width="260" height="93"></a>
    <div class="tools"><button class="ibtn" aria-label="${t.search}">${I.search}</button><button class="ibtn" id="themeBtn" aria-label="${t.theme}">${S.theme === "dark" ? I.sun : I.moon}</button><button class="ibtn" aria-label="${t.menu}">${I.menu}</button></div></header>`;

  let hero = "";
  if (d === "label") {
    hero = `<section class="hero"><div class="title-row"><a class="crumb" href="#">${catName}</a>${photo ? `<img class="thumb" src="${photo}" alt="" width="260" height="173">` : ""}</div>
      <h1>${L.name}</h1>
      <p class="desc">${L.desc}</p>
      <dl class="meta"><div><dt>${t.prep}</dt><dd>${R.prep} ${t.min}</dd></div><div><dt>${t.cook}</dt><dd>${R.cook} ${t.min}</dd></div><div><dt>${t.makes}</dt><dd>${g.n}</dd></div></dl>
      <aside class="facts" aria-label="${t.facts}"><h2>${t.facts}</h2><p class="serving">${t.serving(g.n, uN)}</p>
        <div class="big"><span>${t.per(u1)}</span><strong><span data-per>${fmt(per)}</span><small> mg</small></strong></div>
        <div class="row"><span>${t.whole}</span><b><span data-total>${fmt(total)}</span> mg</b></div>
        <div class="row"><span>${t.cannabis}</span><span data-at>${t.at(g.q, g.pct)}</span></div>
        <p class="begin" data-begin>${begin}</p>
        <div class="actions"><a class="btn" href="#dose">${t.change}</a><a class="btn primary" href="#ingredients">${I.down}${t.jump}</a></div>
      </aside></section>`;
  } else if (d === "garden") {
    hero = `<section class="hero"><div class="cover">${photo ? `<img src="${photo}" alt="" width="260" height="173">` : `${pattern(S.r)}<svg class="hero-glyph" viewBox="0 0 100 100" aria-hidden="true">${glyph.replace(/<\/?svg[^>]*>/g, "")}</svg>`}
        <div class="cover-text"><a class="crumb" href="#">${catName}</a><h1>${L.name}</h1></div></div>
      <p class="desc">${L.desc}</p>
      <ul class="meta"><li>${I.clock}${t.prep} ${R.prep} ${t.min}</li><li>${I.clock}${t.cook} ${R.cook} ${t.min}</li><li>${I.pieces}${g.n} ${uN}</li></ul>
      <div class="dose"><div class="nums"><div><strong><span data-per>${fmt(per)}</span><small> mg</small></strong><span class="lbl">${t.per(u1)}</span></div>
        <div class="whole"><b><span data-total>${fmt(total)}</span> mg</b><span class="lbl">${t.whole}</span></div></div>
        <p class="begin">${I.leaf}<span data-begin>${begin}</span></p>
        <div class="actions"><a class="btn" href="#dose">${t.change}</a><a class="btn primary" href="#ingredients">${I.down}${t.jump}</a></div></div></section>`;
  } else {
    hero = `<section class="hero" style="--cat:${c.color};--cat-deep:${c.deep}"><div class="cover">${photo ? `<div class="duo"><img src="${photo}" alt="" width="260" height="173"></div>` : `<svg class="hero-glyph" viewBox="0 0 100 100" aria-hidden="true">${glyph.replace(/<\/?svg[^>]*>/g, "")}</svg>`}
        <a class="crumb" href="#">${catName}</a></div>
      <div class="sticker" aria-label="${fmt(per)} mg ${t.perShort(u1)}"><b><span data-per>${fmt(per)}</span><small>mg</small></b><span>${t.perShort(u1)}</span></div>
      <h1>${L.name}</h1><p class="desc">${L.desc}</p>
      <dl class="meta"><div><dt>${t.prep}</dt><dd>${R.prep} ${t.min}</dd></div><div><dt>${t.cook}</dt><dd>${R.cook} ${t.min}</dd></div><div><dt>${t.makes}</dt><dd>${g.n} ${uN}</dd></div></dl>
      <div class="doseline"><div><b><span data-total>${fmt(total)}</span> mg</b><span>${t.whole}</span></div><div><b data-at>${t.at(g.q, g.pct)}</b><span>${t.cannabis}</span></div></div>
      <p class="begin" data-begin>${begin}</p>
      <div class="actions"><a class="btn" href="#dose">${t.change}</a><a class="btn primary" href="#ingredients">${I.down}${t.jump}</a></div></section>`;
  }

  const field = (k, label, sub, v) => `<div class="field"><label for="f-${k}">${label}<small>${sub}</small></label>
    <div class="stepper"><button type="button" data-step="${k}" data-d="-1" aria-label="−">−</button><input id="f-${k}" data-k="${k}" inputmode="decimal" value="${v}"><button type="button" data-step="${k}" data-d="1" aria-label="+">+</button></div></div>`;
  const calcBlock = `<section class="block" id="dose"><h2>${t.calc}</h2><p class="hint">${t.calcHint}</p><div class="calc">
    ${field("q", t.grams, t.gramsS, g.q)}${field("pct", t.pct, t.pctS, g.pct)}${field("n", t.portions, t.portionsS(uN), g.n)}
    <div class="out" aria-live="polite"><span>${t.result(u1)}</span><strong><span data-per>${fmt(per)}</span> mg</strong></div></div></section>`;
  const item = (txt, i, num) => `<li><label class="check"><input type="checkbox">${num ? `<span class="num">${i + 1}</span>` : `<span class="box">${I.check}</span>`}<span class="txt">${txt}</span></label></li>`;
  const ing = `<section class="block" id="ingredients"><h2>${t.ing}</h2><p class="hint">${t.tick}</p><ul class="list">${L.ing.map((x, i) => item(x, i)).join("")}</ul></section>`;
  const steps = `<section class="block"><h2>${t.steps}</h2><ol class="list steps">${L.steps.map((x, i) => item(x, i, true)).join("")}</ol>
    <button class="btn wake" id="wake" aria-pressed="false">${I.screen}<span>${t.wake}</span></button></section>`;
  const ad = `<div class="ad"><span class="ad-label">${t.ad}</span><div class="ad-box">300 × 250 · reserved 280 px</div></div>`;
  const tips = L.tips ? `<section class="block"><h2>${t.about}</h2><ul class="tips">${L.tips.map((x) => `<li>${x}</li>`).join("")}</ul></section>
    <section class="block"><h2>${t.faq}</h2>${L.faq.map(([q, a]) => `<details><summary>${q}</summary><p>${a}</p></details>`).join("")}</section>` : "";
  const relCard = (x) => {
    const xc = CAT[x.cat], gl = GLYPH[xc.glyph], img = x.photo ? `<img src="${IMG}recipes/${x.photo}" alt="">` : "";
    const art = d === "garden" ? (img || pattern(x.slug) + gl.replace("<svg", '<svg class="g"')) : d === "poster" ? (img || gl.replace("<svg", '<svg class="g"')) : (img ? img.replace("<img", '<img class="rt"') : `<span class="rt">${gl}</span>`);
    const wrap = d === "label" ? art : `<span class="rt">${art}</span>`;
    return `<li style="--cat:${xc.color};--cat-deep:${xc.deep}"><a href="#">${wrap}<div><b>${S.lang === "zh" ? x.zh : x.name}</b><span>${fmt(dose(x.q, 14, x.n))} mg ${t.perShort(S.lang === "zh" ? "份" : "portion")}</span></div></a></li>`;
  };
  const rel = `<section class="block"><h2>${t.more(catName)}</h2><ul class="rel">${R.related.map(relCard).join("")}</ul></section>`;
  const ftr = `<footer class="ftr"><div class="wrap"><nav>${t.foot.map((x) => `<a href="#">${x}</a>`).join("")}</nav><p>${t.legal}</p></div></footer>`;
  return `<div class="wrap">${hdr}<main>${hero}${calcBlock}${ing}${steps}${ad}${tips}${rel}</main></div>${ftr}`;
}

function bar() {
  const b = (k, v, label) => `<button data-set="${k}" data-v="${v}" aria-pressed="${S[k] === v}">${label}</button>`;
  return `<div class="grp">${b("dir", "label", "A Label")}${b("dir", "garden", "B Garden")}${b("dir", "poster", "C Poster")}</div>
    <div class="grp">${b("r", "pot-brownies", "No photo")}${b("r", "cannabutter", "Photo")}</div>
    <div class="grp">${b("theme", "light", "Light")}${b("theme", "dark", "Dark")}</div>
    <div class="grp">${b("lang", "en", "EN")}${b("lang", "zh", "中文")}</div>`;
}

function render() {
  const h = document.documentElement;
  h.dataset.dir = S.dir; h.dataset.theme = S.theme; h.lang = S.lang === "zh" ? "zh-Hans" : "en";
  document.getElementById("app").innerHTML = page();
  document.getElementById("bar").innerHTML = bar();
  history.replaceState(null, "", "?" + new URLSearchParams(S));
}

function recalc() {
  const R = RECIPES[S.r], t = T[S.lang], u1 = R.unit[S.lang][0];
  const v = (k) => parseFloat(String(document.querySelector(`[data-k=${k}]`).value).replace(",", ".")) || 0;
  calc = { q: v("q"), pct: v("pct"), n: Math.max(1, Math.round(v("n"))) };
  const per = dose(calc.q, calc.pct, calc.n);
  document.querySelectorAll("[data-per]").forEach((e) => { e.textContent = fmt(per); e.classList.remove("bump"); void e.offsetWidth; e.classList.add("bump"); });
  document.querySelectorAll("[data-total]").forEach((e) => (e.textContent = fmt(10 * calc.q * calc.pct)));
  document.querySelectorAll("[data-at]").forEach((e) => (e.textContent = t.at(calc.q, calc.pct)));
  document.querySelectorAll("[data-begin]").forEach((e) => (e.innerHTML = t.begin(t.frac(5 / per, u1))));
}

let lock = null;
document.addEventListener("click", async (e) => {
  const set = e.target.closest("[data-set]");
  if (set) { S[set.dataset.set] = set.dataset.v; if (set.dataset.set === "r") calc = null; return render(); }
  if (e.target.closest("#themeBtn")) { S.theme = S.theme === "dark" ? "light" : "dark"; return render(); }
  const st = e.target.closest("[data-step]");
  if (st) {
    const inp = document.querySelector(`[data-k=${st.dataset.step}]`), k = st.dataset.step;
    const inc = k === "q" ? 0.5 : 1, min = k === "q" ? 0.5 : 1;
    inp.value = Math.max(min, Math.round(((parseFloat(inp.value) || 0) + inc * st.dataset.d) * 10) / 10);
    return recalc();
  }
  const w = e.target.closest("#wake");
  if (w) {
    const t = T[S.lang], on = w.getAttribute("aria-pressed") !== "true";
    try { if (on) lock = await navigator.wakeLock?.request("screen"); else { await lock?.release(); lock = null; } } catch (_) {}
    w.setAttribute("aria-pressed", on); w.querySelector("span").textContent = on ? t.waking : t.wake;
  }
});
document.addEventListener("input", (e) => e.target.matches("[data-k]") && recalc());
render();
</script>
</body>
</html>
