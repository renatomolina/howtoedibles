<!doctype html>
<!-- PROTOTYPE — throwaway. Answers "Do the dish-form glyphs and colour-background photos work as one image system?" (Poster direction).
     Branch prototype/image-system only. `python3 -m http.server 8765` from repo root, then
     /recipes/_prototype-image-system/?view=sheet|covers|grid|table&theme=light|dark&photos=on|off&set=3|all -->
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>PROTOTYPE · image system</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500..800&display=swap">
<style>
:root{--paper:#fff;--ink:#1f1410;--ink-2:#6a5a50;--orange:#f27242;--on-cat:#1f1410;--line:#ecdfd6;--chip:#f6eee9;color-scheme:light}
[data-theme=dark]{--paper:#191210;--ink:#f7ede6;--ink-2:#bba89b;--line:#3a2c26;--chip:#2a1f1b;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-bottom:120px}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
.disp,h1,h2,h3{font-family:Unbounded,sans-serif}
.wrap{max-width:680px;margin:0 auto;padding:0 20px}

/* ---------- the cover: colour block + one cropped glyph, seeded per slug ---------- */
.cv{display:block;position:relative;overflow:hidden;background:var(--cat);contain:paint}
[data-theme=dark] .cv{--cat:var(--cat-dk);--cat-deep:var(--deep-dk)}
.cv>svg{position:absolute;width:var(--gs);height:auto;aspect-ratio:1;right:var(--gx);bottom:var(--gy);transform:rotate(var(--gr))}
.cv>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
[data-theme=dark] .cv>img{filter:brightness(.9)}

/* masthead (from the navigation ticket) */
.hdr{display:flex;align-items:center;justify-content:space-between;height:108px}
.hdr .logo{height:86px;width:auto}
.ibtn{width:48px;height:48px;display:grid;place-items:center;border:2px solid var(--ink);border-radius:50%}
.ibtn svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round}
.tools{display:flex;gap:8px}

/* hero (recipe page) */
.hero{position:relative}
.hero .cv{aspect-ratio:4/3;margin:0 -20px}
@media(min-width:720px){.hero .cv{margin:0;border-radius:28px}}
.crumb{position:absolute;left:20px;top:18px;z-index:1;font-size:14px;font-weight:700;border:2px solid var(--on-cat);color:var(--on-cat);border-radius:999px;padding:6px 14px;background:color-mix(in srgb,var(--cat) 80%,transparent)}
.hero.has-photo .crumb{background:#fffffff0;border-color:#1f1410;color:#1f1410}
.sticker{position:absolute;right:22px;bottom:-34px;z-index:2;width:118px;height:118px;border-radius:50%;background:var(--ink);color:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-8deg);box-shadow:0 0 0 4px var(--paper);line-height:1}
.sticker b{font-family:Unbounded,sans-serif;font-size:38px;font-weight:800}
.sticker b small{font-size:16px}
.sticker span{font-size:13px;margin-top:4px;font-weight:600}
.hero h1{font-weight:800;font-size:38px;line-height:1.02;letter-spacing:-.03em;margin:26px 0 8px;padding-right:124px;hyphens:auto;overflow-wrap:break-word}
.hero p{margin:0;color:var(--ink-2)}

/* cards: 1:1 cover/photo, name, dose */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 14px}
@media(min-width:720px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card .cv{aspect-ratio:1;border-radius:22px}
.card .pill{position:absolute;left:10px;bottom:10px;z-index:1;background:var(--ink);color:var(--paper);font:800 13px/1 Unbounded,sans-serif;padding:7px 10px;border-radius:999px}
.card b{display:block;font-weight:700;font-size:16px;line-height:1.25;margin-top:10px}
.card small{font-size:13px;color:var(--ink-2);font-weight:600}
.sec{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:44px 0 6px}
.sub{color:var(--ink-2);margin:0 0 18px;font-size:15px}

/* glyph sheet: each glyph as a hero (4:3) and a card (1:1), same height */
.sheet{display:grid;gap:26px}
.pair{display:grid;grid-template-columns:4fr 3fr;gap:10px}
.pair .cv{border-radius:18px}
.pair .cv.h{aspect-ratio:4/3}.pair .cv.c{aspect-ratio:1}
.gname{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 8px;font-size:15px}
.gname b{font:800 16px Unbounded,sans-serif}
.gname span{color:var(--ink-2);font-size:13px}
.flat{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-bottom:8px}
.flat .cv{aspect-ratio:1;border-radius:12px}

/* table */
.grp{border-top:2px solid var(--ink);padding:14px 0 18px;display:grid;grid-template-columns:64px 1fr;gap:14px}
.grp .cv{width:64px;height:64px;border-radius:16px}
.grp h3{margin:0;font-size:16px}
.grp p{margin:2px 0 0;font-size:14px;line-height:1.5;color:var(--ink-2)}
.grp p i{font-style:normal;color:var(--ink)}

/* prototype switcher (deliberately off-brand) */
#bar{position:fixed;left:8px;right:8px;bottom:max(8px,env(safe-area-inset-bottom));z-index:99;background:#202124;color:#fff;border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;font:13px/1 -apple-system,system-ui,sans-serif;box-shadow:0 6px 24px rgba(0,0,0,.35)}
#bar .g{display:flex;background:#3c4043;border-radius:9px;padding:2px}
#bar button{border:0;background:none;color:#e8eaed;padding:9px 10px;border-radius:7px;cursor:pointer}
#bar button[aria-pressed=true]{background:#fff;color:#202124;font-weight:600}
body.shot #bar{display:none}
.note{font-size:13px;color:var(--ink-2);background:var(--chip);border-radius:12px;padding:10px 12px;margin:14px 0}
</style>
</head>
<body>
<div id="sprite"></div>
<div id="app"></div>
<div id="bar" role="toolbar" aria-label="Prototype controls"></div>
<script>
const ROOT = "../../";
const P = new URLSearchParams(location.search);
const S = { view: P.get("view") || "grid", theme: P.get("theme") || "light", photos: P.get("photos") || "on", set: P.get("set") || "3" };
if (P.has("shot")) document.body.classList.add("shot");

// [cover, deep glyph, cover in dark, glyph in dark]. Desserts/Essentials decided; Drinks + the other 5 PROVISIONAL.
const CAT = {
  Desserts: ["#f27242", "#c9532a", "#e0673b", "#a8431f"], Essentials: ["#f4c542", "#d89f12", "#dcb03a", "#ad7f0c"],
  Drinks: ["#62b6e8", "#2f86bd", "#4f9fd0", "#24688f"], Snacks: ["#f29cb7", "#d4668a", "#d9879f", "#a94d6c"],
  Lunch: ["#d9b38c", "#a8835a", "#c29e79", "#836343"], Keto: ["#b3a1e6", "#7f69c4", "#9b8ad0", "#5f4ca0"],
  Vegan: ["#5cc48a", "#2f9660", "#4caf78", "#22744a"], International: ["#3fb5b0", "#1f8580", "#349e99", "#166662"],
};
const FORMS = ["cookie", "bar", "cake", "pie", "mug", "glass", "bottle", "butter", "bowl", "pasta", "taco", "sandwich", "pizza", "salad", "gummy", "bonbon", "icecream", "pancake", "bread", "dumpling", "chicken", "fish", "egg", "chips"];
const LABEL = { bar: "bar / brownie", cake: "cake slice", bottle: "bottle / jar", pasta: "pasta / noodles", sandwich: "sandwich / burger", icecream: "ice cream", pancake: "pancake / waffle", bread: "bread / pretzel", chips: "snack / chips" };
const SAMPLES = ["pot-brownies", "pot-cookies", "cannabutter", "infused-coconut-oil", "infused-lemonade", "cannabis-hot-chocolate"];

// Deterministic per-slug crop + rotation (FNV-1a). Same slug → same cover on every build and every page.
function seed(slug) { let h = 2166136261; for (const c of slug) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return (n) => ((h = Math.imul(h ^ (h >>> 15), 2246822507) ^ n) >>> 0) / 4294967296; }
function place(slug, kind) {
  const r = seed(slug);
  // Ranges keep ~60–80% of the glyph visible: bold crop, still readable. right % is of width, bottom % of height.
  if (kind === "flat") return { gs: "76%", gx: "12%", gy: "12%", gr: "0deg" };
  if (kind === "hero") return { gs: `${72 + r(1) * 12}%`, gx: `${-4 - r(2) * 12}%`, gy: `${-16 - r(3) * 18}%`, gr: `${-18 + r(4) * 28}deg` };
  return { gs: `${90 + r(1) * 14}%`, gx: `${-12 - r(2) * 16}%`, gy: `${-12 - r(3) * 16}%`, gr: `${-20 + r(4) * 30}deg` };
}
const vars = (cat, pl = {}) => { const [c, d, cd, dd] = CAT[cat]; return `--cat:${c};--cat-deep:${d};--cat-dk:${cd};--deep-dk:${dd};` + Object.entries(pl).map(([k, v]) => `--${k}:${v}`).join(";"); };
function cover(x, kind, cls = "cv", glyph) {
  const g = glyph || D.glyph[x.slug], photo = kind !== "flat" && S.photos === "on" && D.photos.has(x.slug);
  return `<span class="${cls}" style="${vars(x.cat, place(x.slug, kind))}">${photo
    ? `<img src="photos/${x.slug}.jpg" alt="${esc(x.name)}" ${kind === "hero" ? 'fetchpriority="high"' : 'loading="lazy"'}>`
    : `<svg viewBox="0 0 100 100" aria-hidden="true"><use href="#g-${g}"/></svg>`}</span>`;
}

let D;
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const fmt = (x) => (x >= 10 ? Math.round(x) : Math.round(x * 10) / 10).toString();
async function load() {
  const [rec, glyph, sprite] = await Promise.all([fetch(ROOT + "data/recipes.json").then((r) => r.json()), fetch("glyphs.json").then((r) => r.json()), fetch("sprite.svg").then((r) => r.text())]);
  document.getElementById("sprite").innerHTML = sprite;
  const photos = new Set((await Promise.all(SAMPLES.map((s) => fetch(`photos/${s}.jpg`, { method: "HEAD" }).then((r) => (r.ok ? s : null)).catch(() => null)))).filter(Boolean));
  const list = rec.recipes.map((r) => ({ slug: r.slug, name: r.name, cat: r.category_name, desc: r.description, mg: (10 * r.suggested_quantity * 14) / r.suggested_portion }));
  D = { list, glyph, photos, spriteKB: (sprite.length / 1024).toFixed(1), by: Object.fromEntries(list.map((x) => [x.slug, x])) };
}

const LOGO = `${ROOT}images/howtoedibleslogo.png`;
const masthead = () => `<header class="hdr"><img class="logo" src="${LOGO}" alt="HowToEdibles" width="260" height="93"><div class="tools">
  <span class="ibtn"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></span><span class="ibtn"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg></span></div></header>`;
const hero = (x) => `<section class="hero${S.photos === "on" && D.photos.has(x.slug) ? " has-photo" : ""}" style="${vars(x.cat)}">${cover(x, "hero")}<a class="crumb" href="#">${x.cat}</a>
  <div class="sticker"><b>${fmt(x.mg)}<small>mg</small></b><span>per serving</span></div></section>
  <div class="hero"><h1>${esc(x.name)}</h1><p>${esc(x.desc)}</p></div>`;
const card = (x) => `<a class="card" href="#">${cover(x, "card").replace("</span>", `<span class="pill">${fmt(x.mg)} mg</span></span>`)}<b>${esc(x.name)}</b><small>${x.cat}</small></a>`;

const VIEWS = {
  grid() {
    const three = ["pot-brownies", "cannabutter", "infused-lemonade", "gummy-bears", "pot-cookies", "infused-chai", "cannabis-tincture", "cannabis-hot-chocolate", "cannabis-cheesecake", "infused-coconut-oil", "infused-virgin-mojito", "cannabis-apple-pie", "infused-ghee", "infused-chocolate-truffles"];
    const all = ["pot-brownies", "cannabis-pizza", "infused-lemonade", "cannabis-dim-sum-dumplings", "cannabutter", "infused-guacamole", "pot-cookies", "cannabis-keto-deviled-eggs", "infused-jackfruit-tacos", "cannabis-hot-chocolate", "weed-infused-popcorn", "infused-coconut-oil", "cannabis-grilled-salmon", "gummy-bears"];
    const pick = (S.set === "all" ? all : three).map((s) => D.by[s]);
    const n = pick.filter((x) => S.photos === "on" && D.photos.has(x.slug)).length;
    return `<div class="wrap">${masthead()}${hero(D.by["pot-brownies"])}
      <h2 class="sec" style="margin-top:56px">You might also like</h2><p class="sub">${n} photos, ${pick.length - n} covers${S.set === "all" ? " · all 8 categories (6 colours provisional)" : ""}</p>
      <div class="grid">${pick.map(card).join("")}</div>
      ${D.photos.size ? "" : `<p class="note">No sample photos yet: every card shows its cover. Run <code>gen_photos.py</code>.</p>`}</div>`;
  },
  covers() {
    const sets = { Desserts: ["pot-brownies", "pot-cookies", "cannabis-apple-pie", "infused-chocolate-truffles", "infused-mango-sorbet"], Essentials: ["cannabutter", "cannabis-tincture", "infused-ghee", "infused-olive-oil", "cannabis-flour"], Drinks: ["infused-lemonade", "infused-chai", "infused-virgin-mojito", "cannabis-golden-milk", "infused-whiskey"] };
    const was = S.photos; S.photos = "off";
    const out = `<div class="wrap">${Object.entries(sets).map(([cat, slugs]) => `<h2 class="sec">${cat}</h2><p class="sub">Covers only. Glyphs: ${[...new Set(slugs.map((s) => D.glyph[s]))].join(", ")}</p>
      ${hero(D.by[slugs[0]])}<div class="grid" style="margin-top:28px">${slugs.slice(1).map((s) => card(D.by[s])).join("")}</div>`).join("")}</div>`;
    S.photos = was; return out;
  },
  sheet() {
    const was = S.photos; S.photos = "off";
    const byForm = Object.fromEntries(FORMS.map((f) => [f, D.list.filter((x) => D.glyph[x.slug] === f)]));
    const flat = `<div class="flat">${FORMS.map((f) => cover({ slug: f, cat: "Desserts", name: f }, "flat", "cv", f)).join("")}</div>`;
    const out = `<div class="wrap"><h2 class="sec">Glyph sheet</h2><p class="sub">24 dish forms in one sprite (${D.spriteKB} KB raw). Each is shown as a hero (4:3) and a card (1:1), in the colour of the category that uses it most, cropped and rotated by the first recipe's slug.</p>${flat}
      <div class="sheet">${FORMS.map((f) => { const xs = byForm[f]; const top = Object.entries(xs.reduce((a, x) => ((a[x.cat] = (a[x.cat] || 0) + 1), a), {})).sort((a, b) => b[1] - a[1])[0][0]; const x0 = { ...xs[0], cat: top }, x1 = { ...(xs[1] || xs[0]), cat: top };
        return `<div><p class="gname"><b>${LABEL[f] || f}</b><span>${xs.length} recipes · ${top}</span></p><div class="pair">${cover(x0, "hero", "cv h", f)}${cover(x1, "card", "cv c", f)}</div></div>`; }).join("")}</div></div>`;
    S.photos = was; return out;
  },
  table() {
    return `<div class="wrap"><h2 class="sec">Proposed glyph per recipe</h2><p class="sub">237 recipes → 24 forms, from slug rules plus a few overrides (<code>assign.py</code>). Colour says the category; the glyph says the dish.</p>
      ${FORMS.map((f) => { const xs = D.list.filter((x) => D.glyph[x.slug] === f); return `<div class="grp">${cover({ slug: f, cat: xs[0].cat }, "flat", "cv", f)}<div><h3>${LABEL[f] || f} · ${xs.length}</h3><p>${xs.map((x) => `<i>${esc(x.name)}</i>`).join(" · ")}</p></div></div>`; }).join("")}</div>`;
  },
};

function bar() {
  const b = (k, v, l) => `<button data-set="${k}" data-v="${v}" aria-pressed="${S[k] === v}">${l}</button>`;
  return `<div class="g">${b("view", "grid", "Mixed grid")}${b("view", "covers", "Covers")}${b("view", "sheet", "Glyphs")}${b("view", "table", "Table")}</div>
    <div class="g">${b("theme", "light", "Light")}${b("theme", "dark", "Dark")}</div><div class="g">${b("photos", "on", "Photos")}${b("photos", "off", "Covers only")}</div><div class="g">${b("set", "3", "3 cats")}${b("set", "all", "All 8")}</div>`;
}
async function render() {
  if (!D) await load();
  document.documentElement.dataset.theme = S.theme;
  document.getElementById("app").innerHTML = VIEWS[S.view]();
  document.getElementById("bar").innerHTML = bar();
  history.replaceState(null, "", "?" + new URLSearchParams(S));
}
document.addEventListener("click", (e) => { const s = e.target.closest("[data-set]"); if (s) { S[s.dataset.set] = s.dataset.v; render(); scrollTo(0, 0); } });
render();
</script>
</body>
</html>
