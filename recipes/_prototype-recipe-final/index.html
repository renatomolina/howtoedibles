<!doctype html>
<!-- PROTOTYPE — throwaway. Answers "Does the recipe page hold together with the final calculator, cards and glyphs?"
     = the approved A · Stack recipe page + the final A · Steppers calculator (×0.80) + the shared homepage card + the approved dish-form sprite.
     Branch prototype/recipe-final only. `python3 -m http.server 8765` from repo root, then /recipes/_prototype-recipe-final/
     Params: r=<slug> lang=en|pt|de|zh theme=light|dark fold=1
             top=follow|fixed|zero|hide (Q2: sticky result panel vs compact bar)   panel=full|peek (Q2: what sticks on a phone)
             rail=sticky|static|compact|bottom (Q3: desktop rail)   lines=rec|spec|hero|calc (Q4: beginner line vs split line)
             mini=1 (force the compact bar)   scroll=<id>&dy=<px> (start scrolled)   shot=1 (hide toolbar) -->
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>PROTOTYPE · recipe page, final pieces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500..800&display=swap">
<style>
/* ---------- Poster tokens (visual direction ticket) ---------- */
:root{--paper:#fff;--ink:#1f1410;--ink-2:#6a5a50;--orange:#f27242;--on-cat:#1f1410;--line:#ecdfd6;--chip:#f6eee9;--focus:#1f1410;--mark:color-mix(in srgb,var(--orange) 70%,transparent);--res-top:0px;color-scheme:light}
[data-theme=dark]{--paper:#191210;--ink:#f7ede6;--ink-2:#bba89b;--line:#3a2c26;--chip:#2a1f1b;--focus:#f27242;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:72px}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif}
a{color:inherit}
button,input{font:inherit;color:inherit}
h1,h2,h3{font-family:Unbounded,"PingFang SC","Hiragino Sans GB","Noto Sans SC",sans-serif;overflow-wrap:break-word}
:lang(de) h1,:lang(de) h2,:lang(de) h3{hyphens:auto;-webkit-hyphens:auto}
.wrap{max-width:680px;margin:0 auto;padding:0 20px}
.icon{width:24px;height:24px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}html{scroll-behavior:auto}}

/* ---------- cover: colour block + the recipe's dish-form glyph, cropped/rotated by slug (image-system ticket) ---------- */
.cv{display:block;position:relative;overflow:hidden;background:var(--cat);color:var(--on-cat);contain:paint}
.cv,.hero,.steps-l{--cat:var(--cat-lt);--cat-deep:var(--deep-lt)}
[data-theme=dark] .cv,[data-theme=dark] .hero,[data-theme=dark] .steps-l{--cat:var(--cat-dk);--cat-deep:var(--deep-dk)}
.cv>svg{position:absolute;aspect-ratio:1;width:var(--gs);right:var(--gx);bottom:var(--gy);transform:rotate(var(--gr))}

/* ---------- shell (navigation ticket) ---------- */
.hdr{display:flex;align-items:center;justify-content:space-between;height:108px}
.hdr .logo{height:auto;width:min(240px,calc(100vw - 40px - 116px))}
.tools{display:flex;gap:8px}
.ibtn{width:48px;height:48px;display:grid;place-items:center;border:2px solid var(--ink);border-radius:50%;background:var(--paper)}
.mini{position:fixed;inset:0 0 auto;z-index:20;background:var(--paper);border-bottom:2px solid var(--ink);transform:translateY(-105%);transition:transform .22s ease}
body.mini-on .mini{transform:none}
.mini .wrap{display:flex;align-items:center;justify-content:space-between;height:60px;gap:12px}
.mini .logo{height:40px;width:auto}
.mini .ibtn{width:44px;height:44px}
.mini .spill{flex:1;display:flex;align-items:center;gap:8px;height:44px;border:2px solid var(--ink);border-radius:999px;padding:0 14px;background:var(--chip);font-size:15px;color:var(--ink-2);min-width:0;white-space:nowrap;overflow:hidden}
.mini .spill span{overflow:hidden;text-overflow:ellipsis}
.ftr{margin-top:64px;background:var(--orange);color:#1f1410;padding:28px 0 140px;font-size:14px}

/* ================= HERO (recipe-page ticket, A · Stack) ================= */
.hero{position:relative;--hero-h:clamp(120px,calc(100svh - 428px),232px)}
.hero:has(h1.mid){--hero-h:clamp(100px,calc(100svh - 446px),214px)}
.hero:has(h1.long){--hero-h:clamp(90px,calc(100svh - 470px),190px)}
.hero .cv{height:var(--hero-h,232px);margin:0 -20px}
.hero .cv>svg{width:auto;height:var(--gh)}
.crumb{position:absolute;left:0;top:16px;z-index:1;font-size:14px;font-weight:700;text-decoration:none;border:2px solid #1f1410;color:#1f1410;border-radius:999px;padding:6px 14px;background:color-mix(in srgb,var(--cat) 82%,transparent)}
.sticker{position:absolute;right:-4px;top:calc(var(--hero-h,232px) - 62px);z-index:2;width:112px;height:112px;border-radius:50%;background:var(--ink);color:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-8deg);box-shadow:0 0 0 4px var(--paper);text-align:center;line-height:1;text-decoration:none}
.sticker b{font-family:Unbounded,sans-serif;font-size:34px;font-weight:800;letter-spacing:-.03em}
.sticker b small{font-size:15px;letter-spacing:0}
.sticker>span{font-size:12px;margin-top:5px;font-weight:700;max-width:84px;line-height:1.1}
.sticker.edited::after{content:"";position:absolute;top:6px;right:10px;width:16px;height:16px;border-radius:50%;background:var(--orange);box-shadow:0 0 0 3px var(--paper)}
.sticker.bump{animation:bump .3s ease}
@keyframes bump{50%{transform:rotate(-8deg) scale(1.08)}}
.sticker-room{float:right;width:112px;height:58px}
h1{font-weight:800;font-size:clamp(28px,9.4vw,40px);line-height:1.03;letter-spacing:-.03em;margin:22px 0 14px}
h1.mid{font-size:clamp(26px,8vw,36px)}
h1.long{font-size:clamp(23px,6.6vw,32px)}
:lang(zh) h1{font-weight:900;letter-spacing:0;line-height:1.15}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);clear:both}
.facts>div{padding:10px 0 10px 12px;min-width:0}
.facts>div:first-child{padding-left:0}
.facts>div+div{border-left:1px solid var(--line)}
.facts b{display:block;font-family:Unbounded,"PingFang SC",sans-serif;font-size:18px;font-weight:700;line-height:1.2;white-space:nowrap}
.facts span{display:block;font-size:13px;color:var(--ink-2);line-height:1.25}
.newbie{display:flex;gap:10px;align-items:flex-start;margin:12px 0 0;font-size:15px;line-height:1.4}
.newbie .icon{width:20px;height:20px;margin-top:1px;color:var(--orange)}
.newbie mark{background:linear-gradient(transparent 55%,var(--mark) 55%);color:inherit;font-weight:700}
.newbie a{font-weight:600}
.cta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:6px 14px;border:2px solid var(--ink);border-radius:16px;font-weight:700;text-decoration:none;background:var(--paper);line-height:1.15;text-align:center;font-size:16px}
.btn small{display:block;font-weight:500;font-size:12px;color:var(--ink-2)}
.btn.pri{background:var(--orange);color:#1f1410;border-color:#1f1410}
.btn .icon{width:20px;height:20px}
@media (max-width:400px){.cta .btn:not(.pri) .icon{display:none}}
.intro{margin:28px 0 0;font-size:17px;color:var(--ink-2)}
.intro p{margin:0 0 10px}
section.block{margin-top:44px}
.block>h2,.bh h2{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:0}
.bh{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:6px}
.hint{font-size:14px;color:var(--ink-2);margin:4px 0 12px}

/* ================= CALCULATOR (calculator ticket, A · Steppers + sticky result) ================= */
#dose{scroll-margin-top:16px}
.calc{border:2px solid var(--ink);border-radius:24px;overflow:clip;background:var(--paper)}
.res{position:sticky;top:var(--res-top);z-index:3;background:var(--ink);color:var(--paper);padding:16px 18px 18px;transition:top .22s ease}
.big{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.big .mg{font:800 54px/1 Unbounded,sans-serif;letter-spacing:-.04em;white-space:nowrap}
.big .mg small{font-size:20px;letter-spacing:0}
.big .lbl{font-size:14px;font-weight:600;opacity:.8;display:block;margin-top:4px}
.big .tot{text-align:right;font-size:14px;opacity:.85}
.big .tot b{display:block;font:700 20px/1.1 Unbounded,sans-serif;white-space:nowrap}
.lad{position:relative;display:flex;gap:3px;height:14px;margin:22px 0 8px}
.lad i{flex:1;border-radius:4px;background:var(--c);opacity:.35}
.lad i.on{opacity:1}
.lad .mk{position:absolute;top:-18px;width:0;height:0;border:8px solid transparent;border-top:12px solid currentColor;transform:translateX(-8px);transition:left .25s cubic-bezier(.2,.8,.3,1)}
.lvl{display:flex;gap:4px 10px;align-items:baseline;flex-wrap:wrap}
.lvl b{font-family:Unbounded,"PingFang SC",sans-serif;font-size:18px}
.lvl span{font-size:15px;opacity:.85}
.split{margin:14px 0 0;padding:12px 14px;border-radius:14px;background:var(--orange);color:#1f1410;font-size:16px;line-height:1.35}
.split b{font-family:Unbounded,"PingFang SC",sans-serif}
.split small{display:block;margin-top:2px;opacity:.8}
.split.bad{background:#d9412b;color:#fff}
.ins{padding:6px 18px 14px}
.row{padding:18px 0;border-bottom:1px solid var(--line)}
.row:last-of-type{border-bottom:0}
.q{display:block;font-weight:700;font-size:17px;line-height:1.25;margin:0 0 8px}
.stepper{display:flex;align-items:center;gap:10px}
.rnd{width:52px;height:52px;flex:none;border:2px solid var(--ink);border-radius:50%;background:var(--paper);display:grid;place-items:center;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.rnd:active{background:var(--ink);color:var(--paper)}
.fld{flex:1;min-width:0;display:flex;align-items:baseline;justify-content:center;gap:6px;height:60px;border:2px solid var(--ink);border-radius:16px;padding:0 12px;background:var(--paper);cursor:text}
.fld:focus-within{box-shadow:0 0 0 3px color-mix(in srgb,var(--orange) 60%,transparent)}
.fld input{width:100%;min-width:0;border:0;background:none;outline:none;text-align:right;font:800 28px/58px Unbounded,sans-serif;letter-spacing:-.02em;padding:0}
.fld .u{flex:none;font-weight:700;font-size:15px;color:var(--ink-2);min-width:3.6em}
@media (max-width:359px){.rnd{width:44px;height:44px}.stepper{gap:6px}.fld{padding:0 8px}.fld input{font-size:24px}.fld .u{min-width:0;font-size:13px}}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:10px -18px 0;padding:2px 18px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:44px;border:2px solid var(--line);border-radius:999px;padding:0 14px;background:var(--paper);font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;line-height:1.1}
.chip small{display:block;font-weight:600;font-size:12px;color:var(--ink-2)}
.chip[aria-pressed=true]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.chip[aria-pressed=true] small{color:inherit;opacity:.75}
.cfoot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 14px;padding:12px 18px 16px;border-top:1px solid var(--line);font-size:15px;font-weight:700}
.reset{border:0;background:none;padding:6px 0;font-weight:700;text-decoration:underline;cursor:pointer;font-size:15px;color:var(--orange)}
.reset[hidden]{display:none}
.beg{margin:14px 0 0;font-size:15px}
.beg .hl{background:linear-gradient(transparent 55%,color-mix(in srgb,var(--orange) 45%,transparent) 55%)}
.beg a{font-weight:700}
.help{display:inline-flex;align-items:center;gap:8px;margin-top:10px;font-weight:700;font-size:15px}

/* Q2 · top=… : how the sticky result panel meets the scroll-up compact bar */
body.top-follow.mini-on{--res-top:62px}       /* follow: slides down under the bar while it's shown */
body.top-fixed{--res-top:62px}                /* fixed: always parks 62px down, bar or not */
/* zero = the calculator ticket as written (top:0, the bar covers it); hide = the bar stays away while the card is on screen */

/* Q2 · panel=peek : the big panel scrolls away; a 56px readout sticks instead (no layout shift, sits on top of the card) */
.peek{display:none}
body.panel-peek .res{position:relative;top:auto}
body.panel-peek .peek{display:flex;position:sticky;top:var(--res-top);z-index:4;height:56px;margin-bottom:-56px;align-items:center;justify-content:space-between;gap:10px;padding:0 18px;background:var(--ink);color:var(--paper);opacity:0;pointer-events:none;transition:opacity .15s,top .22s ease;box-shadow:inset 0 -5px 0 var(--lc,#f4c542)}
body.panel-peek .calc.peeking .peek{opacity:1;pointer-events:auto}
.peek b{font:800 26px/1 Unbounded,sans-serif;letter-spacing:-.03em;white-space:nowrap}
.peek b small{font-size:13px;letter-spacing:0}
.peek span{font-size:14px;font-weight:700;text-align:right;line-height:1.2;min-width:0}
.peek span small{display:block;font-weight:500;opacity:.8}

/* ingredients + steps: native checkboxes, CSS-only strike */
.ticks{list-style:none;margin:0;padding:0}
.ticks li{border-top:1px solid var(--line)}
.ticks li:last-child{border-bottom:1px solid var(--line)}
.ticks label{display:flex;gap:14px;align-items:flex-start;padding:13px 0;cursor:pointer;font-size:18px;line-height:1.4;-webkit-tap-highlight-color:transparent}
.ticks input{appearance:none;-webkit-appearance:none;flex:none;width:26px;height:26px;margin:1px 0 0;border:2px solid var(--ink);border-radius:50%;display:grid;place-items:center;cursor:pointer}
.ticks input:checked{background:var(--ink)}
.ticks input:checked::after{content:"";width:10px;height:6px;border:solid var(--paper);border-width:0 0 2.5px 2.5px;transform:translate(0,-1px) rotate(-45deg)}
.ticks .t{background:linear-gradient(var(--mark),var(--mark)) no-repeat 0 58%/0 .32em;transition:background-size .25s ease}
.ticks label:has(input:checked) .t{background-size:100% .32em;color:var(--ink-2)}
.ticks .t a{font-weight:700;text-decoration-thickness:2px;text-underline-offset:3px}
.make-first{display:inline-block;margin-left:6px;font-size:13px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--chip);text-decoration:none;vertical-align:2px}
.steps-l{counter-reset:s}
.steps-l label{font-size:19px;line-height:1.5;padding:16px 0}
.steps-l input{width:40px;height:40px;background:var(--cat);border-color:var(--cat)}
.steps-l input::before{counter-increment:s;content:counter(s);font-family:Unbounded,sans-serif;font-weight:800;font-size:16px;color:#1f1410}
.steps-l input:checked{background:var(--ink);border-color:var(--ink)}
.steps-l input:checked::before{content:none}
.wake{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px 0 10px;border:2px solid var(--ink);border-radius:999px;background:var(--paper);font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap;flex:none}
.wake .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center}
.wake[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.wake[aria-pressed=true] .dot{border-color:var(--orange);background:var(--orange)}
.wake-big{width:100%;justify-content:center;min-height:52px;margin-top:18px;font-size:16px;border-radius:16px}
.wake-note{font-size:13px;color:var(--ink-2);margin:6px 0 0}

.ad{margin:44px -20px 0;padding:8px 20px 20px;background:var(--chip)}
.ad small{display:block;font-size:12px;color:var(--ink-2);margin-bottom:6px;letter-spacing:.04em}
.ad div{min-height:280px;border:1px dashed color-mix(in srgb,var(--ink-2) 50%,transparent);border-radius:8px;display:grid;place-items:center;font-size:13px;color:var(--ink-2);text-align:center;padding:12px}

.tips{margin:0;padding:0;list-style:none}
.tips li{position:relative;padding:10px 0 10px 26px;font-size:17px;line-height:1.5}
.tips li::before{content:"";position:absolute;left:2px;top:19px;width:10px;height:10px;border-radius:50%;background:var(--orange)}
.acc{border-top:2px solid var(--ink)}
.acc:last-of-type{border-bottom:2px solid var(--ink)}
.acc summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px;padding:12px 0;cursor:pointer;font-weight:700;font-size:17px;line-height:1.3}
.acc summary::-webkit-details-marker{display:none}
.acc summary .pm{flex:none;width:32px;height:32px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;transition:transform .2s}
.acc[open] summary .pm{transform:rotate(45deg);background:var(--ink);color:var(--paper)}
.acc .body{padding:0 0 16px}
.acc .body p{margin:0;color:var(--ink-2)}
.acc-h{font-family:Unbounded,"PingFang SC",sans-serif;font-weight:700}

/* ================= THE card (homepage ticket): 1:1 cover + small rotated mg sticker ================= */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 14px;margin-top:14px}
.card{text-decoration:none;display:block;min-width:0}
.card .cv{aspect-ratio:1;border-radius:20px}
.card .dot{position:absolute;right:8px;bottom:8px;z-index:1;min-width:52px;height:52px;padding:0 6px;border-radius:50%;background:var(--ink);color:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-8deg);line-height:1;box-shadow:0 0 0 3px var(--cat)}
.card .dot b{font-family:Unbounded,sans-serif;font-size:16px;font-weight:800;letter-spacing:-.03em}
.card .dot small{font-size:10px;font-weight:700}
.card .nm{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:700;font-size:16px;line-height:1.25;margin-top:8px}

/* ================= DESKTOP ≥1000px: content + 380px rail ================= */
@media (min-width:720px) and (max-width:999px){.hero .cv{margin:0;border-radius:28px}.ad{margin-left:0;margin-right:0;border-radius:16px}.crumb{left:20px}}
@media (min-width:1000px){
  .wrap{max-width:1160px;padding:0 32px}
  .page{display:grid;grid-template-columns:minmax(0,1fr) 380px;column-gap:56px}
  .page>*{grid-column:1}
  .page>.rail{grid-column:2;grid-row:1/span 40;align-self:start}
  .rail .block{margin-top:0}
  .hero .cv{margin:0;border-radius:28px}
  .hero,.hero:has(h1.mid),.hero:has(h1.long){--hero-h:clamp(220px,calc(100svh - 400px),400px)}
  .crumb{left:20px}
  .sticker{right:28px;width:132px;height:132px;top:calc(var(--hero-h) - 70px)}
  .sticker b{font-size:42px}
  .sticker-room{width:140px;height:70px}
  h1{font-size:52px;margin-top:30px}
  h1.mid{font-size:46px}
  h1.long{font-size:40px}
  .ad{margin-left:0;margin-right:0;border-radius:16px}
  .grid{grid-template-columns:repeat(4,minmax(0,1fr))}
  /* Q3 · rail=… */
  body.rail-sticky .rail{position:sticky;top:calc(var(--res-top) + 24px);transition:top .22s ease}
  /* compact: sticks at the top when it fits; on short screens (1366×657 laptops) it scrolls until its bottom is in view, and the 56px peek takes over the dose readout */
  body.rail-compact .rail{position:sticky;top:min(calc(var(--res-top) + 24px),calc(100vh - var(--rail-h,0px) - 16px))}
  body.rail-compact.panel-full .res{top:calc(var(--res-top) + 16px)}
  body.rail-bottom .rail{position:sticky;top:min(calc(var(--res-top) + 24px),calc(100vh - var(--rail-h,0px) - 24px))}
  body.rail-bottom .res{top:calc(var(--res-top) + 24px)}
  body.rail-compact .rail .hint{display:none}
  body.rail-compact .res{padding:12px 16px 14px}
  body.rail-compact .big .mg{font-size:44px}
  body.rail-compact .lad{margin:16px 0 6px;height:10px}
  body.rail-compact .lvl span{font-size:13px}
  body.rail-compact .split{margin-top:10px;padding:8px 12px;font-size:14px}
  body.rail-compact .ins{padding:0 16px 6px}
  body.rail-compact .row{padding:10px 0}
  body.rail-compact .q{font-size:14px;margin:0 0 6px}
  body.rail-compact .stepper{gap:6px}
  body.rail-compact .rnd{width:40px;height:40px}
  body.rail-compact .fld{height:44px;border-radius:12px}
  body.rail-compact .fld input{font-size:20px;line-height:42px}
  body.rail-compact .fld .u{min-width:0;font-size:13px}
  body.rail-compact .chips{margin:8px -16px 0;padding:0 16px}
  body.rail-compact .chip{min-height:34px;padding:0 10px;font-size:13px}
  body.rail-compact .chip small{display:none}
  body.rail-compact .cfoot{padding:8px 16px 12px;font-size:14px}
}

/* ---------- prototype switcher (deliberately off-brand) ---------- */

// ---------- the one formula, the one ladder, the one 5 mg helper ----------
const EFF = 0.8; // COOKING_EFFICIENCY (js/calculator.js + build_site.rb)

const RANGES = ["1–2.5 mg", "2.5–5 mg", "5–15 mg", "15–30 mg", "30–50 mg", "50+ mg"];
const lvlIdx = (mg) => { const i = LEVELS.findIndex((l) => mg <= l[2]); return i < 0 ? 5 : i; };
const FRACS = [[1 / 2, "½", "半"], [1 / 3, "⅓", "三分之一"], [1 / 4, "¼", "四分之一"], [1 / 6, "⅙", "六分之一"], [1 / 8, "⅛", "八分之一"], [1 / 10, "1/10", "十分之一"], [1 / 12, "1/12", "十二分之一"]];
// ONE helper feeds the hero beginner line and the calculator split line: largest piece that stays ≤ 5 mg (rounds down)
const fiveMg = (mg) => { if (mg <= 5) return { one: true }; const f = FRACS.find(([v]) => v <= 5 / mg); return f ? { f: S.lang === "zh" ? f[2] : f[1], mg: mg * f[0] } : { tooStrong: true }; };
const LIM = { g: [0.1, 28, 0.5], s: [1, 99, 1], n: [1, 200, 1] };
const clamp = (k, v) => Math.min(LIM[k][1], Math.max(LIM[k][0], v));

// ---------- data (real files) ----------
let D = null, R, x, def;
async function load() {
  const j = (p) => fetch(p).then((r) => r.json());

  const [rec, ui, tr, txt, enr, secL, secEn, glyph, sprite] = await Promise.all([j(ROOT + "data/recipes.json"), j(`${ROOT}i18n/${L}.json`), L === "en" ? null : j(`${ROOT}i18n/recipes_${L}.json`),
    j(ROOT + "data/recipes_text.json"), j(ROOT + "data/recipe_enrichment.json"), j(`${ROOT}i18n/recipe_sections_${L}.json`), j(ROOT + "i18n/recipe_sections_en.json"), j("glyphs.json"), fetch("sprite.svg").then((r) => r.text())]);
  document.getElementById("sprite").innerHTML = sprite;
  D = { rec, ui, tr, txt, enr, secL, secEn, glyph, c: ui.calculator, lang: L };
}
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

const nf = (v, d) => new Intl.NumberFormat(S.lang === "zh" ? "zh-CN" : S.lang, { maximumFractionDigits: d }).format(v);
const fmtMg = (mg) => nf(mg, mg >= 10 ? 0 : 1);
const fmtG = (g) => nf(g, g < 1 ? 2 : 1);
const parse = (s) => parseFloat(String(s).replace(",", "."));
const iso = (p) => { const m = /PT(?:(\d+)H)?(?:(\d+)M)?/.exec(p || ""); return m ? (+m[1] || 0) * 60 + (+m[2] || 0) : 0; };
const dur = (m) => { const t = T[S.lang]; return m >= 60 ? `${Math.floor(m / 60)} ${t.h}${m % 60 ? " " + (m % 60) : ""}` : `${m} ${t.min}`; };
const interp = (s, v) => s.replace(/%\{(\w+)\}/g, (_, k) => v[k] ?? "");
const pre = () => (S.lang === "en" ? "" : "/" + S.lang);
const nameOf = (slug) => D.tr?.[slug]?.name || D.rec.recipes.find((r) => r.slug === slug).name;
// title size band by visual length (CJK ≈ 1.7 Latin chars); with vw-based sizes the line count stays the same on every phone width
const titleClass = (name) => { const n = [...name].reduce((a, c) => a + (/[\u3000-\u9fff]/.test(c) ? 1.7 : 1), 0); return n > 24 ? ' class="long"' : n > 14 ? ' class="mid"' : ""; };
function seed(slug) { let h = 2166136261; for (const c of slug) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return (n) => ((h = Math.imul(h ^ (h >>> 15), 2246822507) ^ n) >>> 0) / 4294967296; }
function place(slug, kind) {
  const r = seed(slug);
  if (kind === "hero") return { gh: `${124 + r(1) * 22}%`, gs: "auto", gx: `${-2 - r(2) * 10}%`, gy: `${-22 - r(3) * 22}%`, gr: `${-18 + r(4) * 28}deg` };
  return { gs: `${90 + r(1) * 14}%`, gx: `${-12 - r(2) * 16}%`, gy: `${-12 - r(3) * 16}%`, gr: `${-20 + r(4) * 30}deg` };

const cover = (slug, cat, kind, inner = "") => `<span class="cv" style="${vars(cat, place(slug, kind))}" aria-hidden="true"><svg viewBox="0 0 100 100"><use href="#g-${D.glyph[slug] || "bowl"}"/></svg>${inner}</span>`;

function sections() {
  const e = D.enr[R.slug] || {}, sub = e.sub_category || "general", name = nameOf(R.slug);
  const tm = D.secL.templates?.[R.category_name]?.[sub] || D.secEn.templates?.[R.category_name]?.[sub] || {};
  const v = { name, base_fat: e.base_fat || "cannabutter", cook_temp: e.cook_temp || "350°F / 180°C", category: R.category_name };
  const own = (k) => D.tr?.[R.slug]?.[k] || e[k];
  const lab = (k) => interp(D.secL.section_labels?.[k] || D.secEn.section_labels[k], v);
  const more = (k, u) => { const l = (tm[k] || []).map((s) => interp(s, v)); if (own(u)) l.push(own(u)); return l; };
  return { intro: (interp(tm.intro || "", { ...v, name: name.toLowerCase() }) + " " + (own("intro_unique") || "")).trim(), tips: more("dosing_tips", "dosing_unique"),
    acc: [[lab("common_mistakes"), more("common_mistakes")], [lab("storage"), more("storage", "storage_unique")], [lab("variations"), more("variations", "variation_unique")]],
    faq: (tm.faq || []).map((f) => [interp(f.q, v), interp(f.a, v)]) };

const t = () => T[S.lang];

const field = (k) => `<div class="stepper"><button type="button" class="rnd" data-step="${k}" data-d="-1" aria-label="−">${I.minus}</button>
  <label class="fld"><input data-in="${k}" inputmode="decimal" enterkeyhint="done" autocomplete="off" value="${k === "g" ? fmtG(x.g) : x[k]}" aria-label="${esc(Q(k))}"><span class="u" data-unit="${k}">${unit(k)}</span></label>
  <button type="button" class="rnd" data-step="${k}" data-d="1" aria-label="+">${I.plusB}</button></div>`;
const showHero = () => S.lines !== "calc", showSplit = () => S.lines !== "hero", showCalcBeg = () => S.lines === "spec";

function newbieHTML(mg) {
  const h = fiveMg(mg);
  return (h.one ? t().newbieOne : h.tooStrong ? t().newbieTooStrong : t().newbie(h.f, fmtMg(h.mg))) + ` <a href="${pre()}/edibles-for-beginners.html">${t().newbieLink}</a>`;
}
function splitHTML(mg) {
  if (!showSplit()) return "";
  const h = fiveMg(mg), cut = Math.ceil((10 * x.g * x.s * EFF) / 5);
  if (h.one) return "";
  return h.f ? `<p class="split">${t().split(h.f, nf(5, 1))}<small>${t().cut(cut)}</small></p>` : `<p class="split bad">${t().tooStrong}<small>${t().cut(cut)}</small></p>`;
}
function liveHTML(mg) {
  const i = lvlIdx(mg), [, lo, hi] = LEVELS[i], pos = ((i + Math.min(1, Math.max(0, (mg - lo) / (hi - lo)))) / 6) * 100;
  return `<div class="big"><div><span class="mg">${fmtMg(mg)}<small> mg</small></span><span class="lbl">${t().per}</span></div><div class="tot"><b>${fmtMg(mg * x.n)} mg</b>${t().batch}</div></div>
    <div class="lad" aria-hidden="true">${LEVELS.map((l, j) => `<i style="--c:${l[3]}" class="${j === i ? "on" : ""}"></i>`).join("")}<span class="mk" style="left:${pos}%"></span></div>
    <div class="lvl"><b>${D.c["dosage_" + LEVELS[i][0]]}</b><span>${RANGES[i]} · ${D.c["dosage_" + LEVELS[i][0] + "_desc"]}</span></div>${splitHTML(mg)}`;
}
const peekHTML = (mg) => { const i = lvlIdx(mg); return `<b>${fmtMg(mg)}<small> mg</small></b><span>${D.c["dosage_" + LEVELS[i][0]]}<small>${t().per} · ${fmtMg(mg * x.n)} mg ${t().batch.toLowerCase()}</small></span>`; };

function card(r) {
  const mg = (10 * r.suggested_quantity * 14 * EFF) / r.suggested_portion;
  return `<a class="card" href="?${new URLSearchParams({ ...S, r: r.slug })}" data-card="${r.slug}">${cover(r.slug, r.category_name, "card", `<span class="dot" title="${fmtMg(mg)} mg THC ${t().per}"><b>${fmtMg(mg)}</b><small>mg</small></span>`)}<span class="nm">${esc(nameOf(r.slug))}</span></a>`;
}

// ---------- page ----------
function page() {
  const tx = S.lang === "en" ? D.txt[R.slug] : D.tr?.[R.slug], e = D.enr[R.slug] || {}, sec = sections();
  const name = nameOf(R.slug), catT = D.ui.categories[R.category_name], mg = mgOf(x);
  const total = iso(e.totalTime) || iso(e.prepTime) + iso(e.cookTime);
  const LOGO = `${ROOT}images/howtoedibleslogo.png`;
  const ingL = (tx?.ingredients || []).map((i) => { let s = esc(clean(i));
    s = s.replace(/(cannabutter|canna-?butter|Cannabutter|大麻黄油|manteiga de cannabis)/, (m) => R.slug === "cannabutter" ? m : `<a href="${pre()}/recipes/cannabutter/">${m}</a><a class="make-first" href="${pre()}/recipes/cannabutter/">${t().makeFirst}</a>`);
    return `<li><label><input type="checkbox"><span class="t">${s}</span></label></li>`; }).join("");
  const stepL = (tx?.instructions || []).map((i) => `<li><label><input type="checkbox"><span class="t">${esc(clean(i))}</span></label></li>`).join("");
  const wake = (cls = "") => `<button type="button" class="wake ${cls}" data-wake aria-pressed="false"><span class="dot">${I.sun}</span>${t().wake}</button>`;

  const hero = `<section class="hero" style="${vars(R.category_name)}">${cover(R.slug, R.category_name, "hero")}<a class="crumb" href="#">${esc(catT)}</a>
      <a class="sticker" href="#dose" id="sticker"><b data-o="mgs">${fmtMg(mg)}<small>mg</small></b><span>${t().per}</span></a>
      <span class="sticker-room" aria-hidden="true"></span><h1${titleClass(name)}>${esc(name)}</h1>
      <div class="facts"><div><b>${dur(total)}</b><span>${t().total}</span></div><div><b data-o="n">${x.n}</b><span>${t().makes}</span></div><div><b data-o="batch">${fmtMg(mg * x.n)} mg</b><span>${t().batch}</span></div></div>
      ${showHero() ? `<p class="newbie">${I.warn}<span data-o="newbie">${newbieHTML(mg)}</span></p>` : ""}
      <div class="cta"><a class="btn" href="#dose">${I.dial}<span>${t().adjust}<small data-o="adj">${t().adjSub(fmtG(x.g), nf(x.s, 1))}</small></span></a><a class="btn pri" href="#recipe">${t().jump}${I.down}</a></div></section>`;
  const intro = `<div class="intro"><p>${esc(tx?.description || R.description)}</p><p>${esc(sec.intro)}</p></div>`;
  const calc = `<div class="rail"><section class="block" id="dose"><h2>${t().dose}</h2><p class="hint">${t().doseHint}</p>
      <div class="calc" id="calc"><div class="peek" aria-hidden="true" id="peek">${peekHTML(mg)}</div><div class="res" aria-live="polite" id="live">${liveHTML(mg)}</div>
        <div class="ins">${["g", "s", "n"].map((k) => `<div class="row"><label class="q">${esc(Q(k))}</label>${field(k)}${chipRow(k)}</div>`).join("")}</div>
        <div class="cfoot"><a href="${pre()}/calculator.html">${t().calcPage}</a><a href="${pre()}/calculator.html#potency">${t().guide}</a><button type="button" class="reset" data-reset hidden>${t().reset}</button></div></div>
      ${showCalcBeg() ? `<p class="beg"><span class="hl">${t().beg}</span> <a href="#">${t().begL}</a></p>` : ""}
      <a class="help" href="https://bit.ly/helpimhavingabadtrip" target="_blank" rel="noopener">${I.life}${t().help}</a></section></div>`;
  const ingB = `<section class="block" id="recipe"><div class="bh"><h2>${t().ing}</h2>${wake()}</div><p class="hint">${t().tap}</p><ul class="ticks">${ingL}</ul></section>`;
  const stepB = `<section class="block steps-l-wrap" style="${vars(R.category_name)}"><div class="bh"><h2>${t().steps}</h2></div><ol class="ticks steps-l" style="${vars(R.category_name)}">${stepL}</ol>${wake("wake-big")}<p class="wake-note" data-wake-note hidden>${t().wakeNo}</p></section>`;
  const ad = (k) => `<aside class="ad" aria-label="${t().ad}"><small>${t().ad}</small><div>Manual slot ${k} · responsive · min-height 280px reserved</div></aside>`;
  const tipsB = `<section class="block"><h2>${t().tips}</h2><ul class="tips">${sec.tips.map((s) => `<li>${esc(s)}</li>`).join("")}</ul>
      <div style="margin-top:22px">${sec.acc.filter(([, l]) => l.length).map(([h, l]) => `<details class="acc"><summary><span class="acc-h">${esc(h)}</span><span class="pm">${I.plus}</span></summary><div class="body"><ul class="tips">${l.map((s) => `<li>${esc(s)}</li>`).join("")}</ul></div></details>`).join("")}</div></section>`;
  const faqB = `<section class="block"><h2>${t().faq}</h2><div style="margin-top:12px">${sec.faq.map(([q, a]) => `<details class="acc"><summary>${esc(q)}<span class="pm">${I.plus}</span></summary><div class="body"><p>${esc(a)}</p></div></details>`).join("")}</div></section>`;
  const rs = seed(R.slug), rel = D.rec.recipes.filter((y) => y.category_name === R.category_name && y.slug !== R.slug).map((y) => [rs(y.slug.length), y]).sort((a, b) => a[0] - b[0]).slice(0, 4).map((p) => p[1]);
  const relB = `<section class="block"><h2>${t().related(catT)}</h2><div class="grid">${rel.map(card).join("")}</div></section>`;

  const mini = `<div class="mini" id="mini"><div class="wrap"><img class="logo" src="${LOGO}" alt="" width="260" height="93"><span class="spill">${I.search}<span>${t().search(D.rec.recipes.length)}</span></span><span class="ibtn">${I.menu}</span></div></div>`;
  const masthead = `<header class="hdr"><img class="logo" src="${LOGO}" alt="HowToEdibles" width="260" height="93"><div class="tools"><span class="ibtn">${I.search}</span><span class="ibtn">${I.menu}</span></div></header>`;
  return `${mini}<div class="wrap">${masthead}<main class="page">${[hero, intro, calc, ingB, stepB, ad(1), tipsB, faqB, ad(2), relB].join("")}</main></div>
    <footer class="ftr"><div class="wrap">Footer (navigation ticket)</div></footer>${S.fold === "1" ? '<div id="fold"><span>Safari first screen · 664px</span></div>' : ""}`;
}

// ---------- live update: never re-renders the inputs (keyboard stays open) ----------
function liveAll(bump) {
  const mg = mgOf(x), set = (o, h) => document.querySelectorAll(`[data-o="${o}"]`).forEach((el) => (el.innerHTML = h));
  document.getElementById("live").innerHTML = liveHTML(mg);
  document.getElementById("peek").innerHTML = peekHTML(mg);
  document.getElementById("peek").style.setProperty("--lc", LEVELS[lvlIdx(mg)][3]);
  set("mgs", `${fmtMg(mg)}<small>mg</small>`); set("batch", `${fmtMg(mg * x.n)} mg`); set("n", x.n);
  set("adj", t().adjSub(fmtG(x.g), nf(x.s, 1))); set("newbie", newbieHTML(mg));
  document.querySelectorAll("[data-unit=n]").forEach((el) => (el.textContent = t().serv(x.n)));
  document.querySelectorAll("[data-in]").forEach((i) => { if (i !== document.activeElement) i.value = i.dataset.in === "g" ? fmtG(x.g) : nf(x[i.dataset.in], 1); });
  document.querySelectorAll(".chip[data-k]").forEach((b) => b.setAttribute("aria-pressed", x[b.dataset.k] === +b.dataset.v));
  document.querySelector("[data-reset]").hidden = !edited();
  const st = document.getElementById("sticker"); st.classList.toggle("edited", edited());
  if (bump) { st.classList.remove("bump"); void st.offsetWidth; st.classList.add("bump"); }
  measure();
}

// ---------- measurements surfaced in the toolbar (what the questions are about) ----------
function measure() {
  const y = (el) => Math.round(el.getBoundingClientRect().top + scrollY), hgt = (el) => Math.round(el.getBoundingClientRect().height);
  const cta = document.querySelector(".cta"), h1 = document.querySelector("h1"), card = document.getElementById("calc"), res = document.getElementById("live"), rail = document.querySelector(".rail");
  const lh = parseFloat(getComputedStyle(h1).lineHeight);
  document.body.style.setProperty("--rail-h", rail.offsetHeight + "px");
  const desk = innerWidth >= 1000;
  window.__m = { vw: innerWidth, vh: innerHeight, ctaBottom: y(cta) + hgt(cta), h1Lines: Math.round(hgt(h1) / lh), calcCard: hgt(card), panel: hgt(res), rail: rail.offsetHeight,
    fieldsVisibleUnderPanel: innerHeight - (S.top === "zero" || S.top === "hide" ? 0 : 62) - (S.panel === "peek" ? 56 : hgt(res)), railFits: desk ? rail.offsetHeight + 24 <= innerHeight : null };
  const m = document.querySelector("#bar .m");
  if (m) { const M = window.__m;
    m.textContent = `${M.vw}×${M.vh} · first screen: CTA bottom ${M.ctaBottom}px ${M.ctaBottom <= 664 ? "≤" : ">"} 664 · H1 ${M.h1Lines} lines · calc card ${M.calcCard}px · sticky panel ${S.panel === "peek" ? "56 (peek)" : M.panel}px · room for fields under it ${M.fieldsVisibleUnderPanel}px` + (desk ? ` · rail ${M.rail}px ${M.railFits ? "fits" : "does NOT fit"} ${M.vh}` : ""); }
}

// ---------- toolbar ----------
function bar() {
  const b = (k, v, l) => `<button data-set="${k}" data-v="${v}" aria-pressed="${S[k] === v}">${l}</button>`;
  return `<div class="grp">${b("r", "pot-brownies", "Brownies")}${b("r", "cannabutter", "Butter")}${b("r", "cannabis-hot-chocolate", "Cocoa")}${b("r", "infused-keto-chocolate-avocado-mousse", "Long")}${b("r", "infused-olive-oil", "≤5mg")}</div>
    <div class="grp">${b("lang", "en", "EN")}${b("lang", "pt", "PT")}${b("lang", "de", "DE")}${b("lang", "zh", "中文")}</div>
    <div class="grp">${b("theme", "light", "☀")}${b("theme", "dark", "☾")}${b("fold", "1", "Fold")}</div>
    <div class="grp"><i>Q2 top</i>${b("top", "follow", "follow bar ✓")}${b("top", "fixed", "62px")}${b("top", "zero", "0 (spec)")}${b("top", "hide", "hide bar")}</div>
    <div class="grp"><i>Q2 sticks</i>${b("panel", "full", "full panel")}${b("panel", "peek", "56px peek")}</div>
    <div class="grp"><i>Q3 rail</i>${b("rail", "sticky", "sticky (spec)")}${b("rail", "static", "static")}${b("rail", "compact", "compact ✓")}${b("rail", "bottom", "stick at bottom")}</div>
    <div class="grp"><i>Q4 lines</i>${b("lines", "rec", "hero + split ✓")}${b("lines", "spec", "all 3 (spec)")}${b("lines", "hero", "hero only")}${b("lines", "calc", "calc only")}</div>
    <div class="grp min"><button data-min>▾</button></div><div class="m"></div>`;
}
async function render() {
  if (!D || D.lang !== S.lang) await load();
  R = D.rec.recipes.find((r) => r.slug === S.r);
  def = { g: +R.suggested_quantity, s: 14, n: +R.suggested_portion };
  x = { ...def };
  document.documentElement.lang = S.lang === "zh" ? "zh-Hans" : S.lang;
  document.documentElement.dataset.theme = S.theme;
  document.body.className = [...document.body.classList].filter((c) => !/^(top|panel|rail|lines)-/.test(c)).concat([`top-${S.top}`, `panel-${S.panel}`, `rail-${S.rail}`, `lines-${S.lines}`]).join(" ");
  document.getElementById("app").innerHTML = page();
  history.replaceState(null, "", "?" + new URLSearchParams({ ...S, ...(P.has("shot") ? { shot: 1 } : {}) }));
  document.getElementById("bar").innerHTML = bar();
  liveAll();
  if (P.get("mini") === "1") document.body.classList.add("mini-on");
  if (P.has("scroll")) { await document.fonts.ready; const el = document.getElementById(P.get("scroll")); scrollTo({ top: el.getBoundingClientRect().top + scrollY + +(P.get("dy") || 0), behavior: "instant" }); onScroll(true); }
}

// compact bar in on scroll-up only (navigation ticket). top=hide keeps it away while the calculator card is on screen.
let lastY = scrollY;
function onScroll(force) {
  const y = scrollY, card = document.getElementById("calc");
  if (card) {
    const r = card.getBoundingClientRect(), calcOn = r.top < innerHeight && r.bottom > 0;
    if (P.get("mini") !== "1" && (force === true || Math.abs(y - lastY) > 6)) { document.body.classList.toggle("mini-on", y > 140 && y < lastY && !(S.top === "hide" && calcOn)); lastY = y; }
    const rt = parseFloat(getComputedStyle(document.body).getPropertyValue("--res-top")) || 0;
    card.classList.toggle("peeking", document.getElementById("live").getBoundingClientRect().top < rt - 1 && r.bottom > rt + 120);
  }
}
addEventListener("scroll", onScroll, { passive: true });
addEventListener("resize", () => D && measure());

// keep screen on (Wake Lock API)
let lock = null;
async function wake(on) {
  try { if (on) { lock = await navigator.wakeLock.request("screen"); } else { await lock?.release(); lock = null; } setWake(on); }
  catch { document.querySelectorAll("[data-wake-note]").forEach((n) => (n.hidden = false)); setWake(false); }
}
function setWake(on) { document.querySelectorAll("[data-wake]").forEach((b) => { b.setAttribute("aria-pressed", on); b.lastChild.textContent = on ? t().wakeOn : t().wake; }); }

function setK(k, v) { if (!isFinite(v)) return; x[k] = k === "n" ? Math.round(clamp(k, v)) : Math.round(clamp(k, v) * 100) / 100; liveAll(true); }
document.addEventListener("input", (e) => { const k = e.target.dataset.in; if (k) { const v = parse(e.target.value); if (v > 0) setK(k, v); } });
document.addEventListener("change", (e) => { if (e.target.dataset.in) { e.target.blur(); liveAll(); } });
document.addEventListener("keydown", (e) => { if (e.target.dataset?.in && e.key === "Enter") e.target.blur(); });
document.addEventListener("click", (e) => {
  const set = e.target.closest("[data-set]"); if (set) { S[set.dataset.set] = S.fold === "1" && set.dataset.set === "fold" ? "0" : set.dataset.v; return render(); }
  if (e.target.closest("[data-min]")) return document.body.classList.toggle("barmin");
  const st = e.target.closest("[data-step]"); if (st) { const k = st.dataset.step, step = LIM[k][2] * +st.dataset.d; return setK(k, k === "g" ? Math.round((x.g + step) / LIM.g[2]) * LIM.g[2] || LIM.g[0] : x[k] + step); }
  const ch = e.target.closest(".chip[data-k]"); if (ch) return setK(ch.dataset.k, +ch.dataset.v);
  if (e.target.closest("[data-reset]")) { x = { ...def }; return liveAll(true); }
  const w = e.target.closest("[data-wake]"); if (w) return wake(w.getAttribute("aria-pressed") !== "true");
  const c = e.target.closest("[data-card]"); if (c) { e.preventDefault(); S.r = c.dataset.card; render().then(() => scrollTo(0, 0)); }
});
render().then(() => document.fonts.ready).then(() => measure());
</script>
