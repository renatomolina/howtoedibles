<!doctype html>
<!-- PROTOTYPE — throwaway. Answers "How should the dosage calculator work on mobile?" (Poster direction).
     Three variants of the calculator, switchable via ?v=A|B|C, each shown inside a recipe page (?page=recipe&r=slug)
     and as the standalone calculator page (?page=calc). Real data from data/recipes.json + i18n/*.json.
     Branch prototype/calculator only. `python3 -m http.server 8765` from repo root, then
     /recipes/_prototype-calculator/?v=A&page=recipe&r=pot-brownies&lang=en|pt|de|zh&theme=light|dark
     Formula (fixed): mg per serving = 10 × grams × THC% ÷ servings. -->
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>PROTOTYPE · calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500..800&display=swap">
<style>
/* ---------- Poster tokens (visual direction ticket) ---------- */
:root{--paper:#fff;--ink:#1f1410;--ink-2:#6a5a50;--orange:#f27242;--on-cat:#1f1410;--line:#ecdfd6;--chip:#f6eee9;--focus:#1f1410;color-scheme:light}
[data-theme=dark]{--paper:#191210;--ink:#f7ede6;--ink-2:#bba89b;--line:#3a2c26;--chip:#2a1f1b;--focus:#f27242;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif}
a{color:inherit}
button,input{font:inherit;color:inherit}
.disp,h1,h2,h3{font-family:Unbounded,"PingFang SC","Hiragino Sans GB","Noto Sans SC",sans-serif}
.wrap{max-width:680px;margin:0 auto;padding:0 20px}
.icon{width:24px;height:24px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
.num{font-family:Unbounded,sans-serif;font-variant-numeric:tabular-nums}

/* ---------- shell (from the navigation ticket, trimmed) ---------- */
.hdr{display:flex;align-items:center;justify-content:space-between;height:108px}
.hdr .logo{height:86px;width:auto}
.tools{display:flex;gap:8px}
.ibtn{width:48px;height:48px;display:grid;place-items:center;border:2px solid var(--ink);border-radius:50%;background:var(--paper);cursor:pointer}
.cv{display:block;position:relative;overflow:hidden;background:var(--cat);color:var(--on-cat);contain:paint}
.cv>svg{position:absolute;right:-30px;bottom:-40px;width:290px;height:290px;transform:rotate(-12deg)}
.gl{fill:var(--cat-deep)} .gl-l{stroke:var(--cat);fill:none;stroke-width:3}
.hero{position:relative}
.hero .cv{height:260px;margin:0 -20px}
@media(min-width:720px){.hero .cv{margin:0;border-radius:28px}}
.crumb{position:absolute;left:20px;top:18px;z-index:1;font-size:14px;font-weight:700;text-decoration:none;border:2px solid var(--on-cat);border-radius:999px;padding:6px 14px;background:color-mix(in srgb,var(--cat) 80%,transparent);color:#1f1410}
.sticker{position:absolute;right:22px;top:170px;z-index:2;width:118px;height:118px;border-radius:50%;background:var(--ink);color:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-8deg);box-shadow:0 0 0 4px var(--paper);text-align:center;line-height:1;transition:background .2s}
.sticker b{font-family:Unbounded,sans-serif;font-size:36px;font-weight:800;letter-spacing:-.03em}
.sticker b small{font-size:15px}
.sticker>span{font-size:13px;margin-top:4px;font-weight:600}
.sticker.edited::after{content:"";position:absolute;top:6px;right:10px;width:16px;height:16px;border-radius:50%;background:var(--orange);box-shadow:0 0 0 3px var(--paper)}
h1{font-weight:800;font-size:38px;line-height:1.04;letter-spacing:-.03em;margin:26px 0 10px;padding-right:118px}
.desc{margin:0 0 16px;font-size:18px;color:var(--ink-2)}
.doseline{display:flex;flex-wrap:wrap;gap:4px 18px;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);padding:10px 0;font-size:15px}
.doseline b{font-family:Unbounded,sans-serif;font-weight:700}
.hl{background:linear-gradient(transparent 55%,color-mix(in srgb,var(--orange) 45%,transparent) 55%)}
.beg{margin:12px 0 0;font-size:16px}
.beg a{font-weight:700}
.btns{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border:2px solid var(--ink);border-radius:16px;font-weight:700;text-decoration:none;background:var(--paper);cursor:pointer;padding:0 12px;text-align:center;line-height:1.2}
.btn.pri{background:var(--orange);border-color:var(--orange);color:#1f1410}
section.block{margin-top:44px;scroll-margin-top:16px}
.block>h2{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:0 0 12px}
.list{margin:0;padding:0;list-style:none}
.list li{padding:12px 0;border-top:1px solid var(--line);font-size:18px}
.steps{counter-reset:s}
.steps li{display:flex;gap:14px}
.steps li::before{counter-increment:s;content:counter(s);font-family:Unbounded,sans-serif;font-weight:800;font-size:16px;width:36px;height:36px;border-radius:50%;background:var(--cat);color:#1f1410;display:grid;place-items:center;flex:none}
.ftr{margin-top:64px;background:var(--orange);color:#1f1410;padding:28px 0 120px;font-size:14px}

/* ---------- shared calculator parts ---------- */
.q{display:block;font-weight:700;font-size:17px;line-height:1.25;margin:0 0 8px}
.stepper{display:flex;align-items:center;gap:10px}
.rnd{width:52px;height:52px;flex:none;border:2px solid var(--ink);border-radius:50%;background:var(--paper);display:grid;place-items:center;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.rnd:active{background:var(--ink);color:var(--paper)}
.fld{flex:1;min-width:0;display:flex;align-items:baseline;justify-content:center;gap:6px;height:60px;border:2px solid var(--ink);border-radius:16px;padding:0 12px;background:var(--paper);cursor:text}
.fld:focus-within{box-shadow:0 0 0 3px color-mix(in srgb,var(--orange) 60%,transparent)}
.fld input{width:100%;min-width:0;border:0;background:none;outline:none;text-align:right;font:800 28px/58px Unbounded,sans-serif;letter-spacing:-.02em;padding:0}
.fld .u{flex:none;font-weight:700;font-size:15px;color:var(--ink-2);text-align:left;min-width:3.6em}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:10px -20px 0;padding:2px 20px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:44px;border:2px solid var(--line);border-radius:999px;padding:0 14px;background:var(--paper);font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;line-height:1.1}
.chip small{display:block;font-weight:600;font-size:12px;color:var(--ink-2)}
.chip[aria-pressed=true]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.chip[aria-pressed=true] small{color:inherit;opacity:.75}
.lad{position:relative;display:flex;gap:3px;height:14px;margin:26px 0 8px}
.lad i{flex:1;border-radius:4px;background:var(--c);opacity:.35}
.lad i.on{opacity:1}
.lad .mk{position:absolute;top:-18px;width:0;height:0;border:8px solid transparent;border-top:12px solid currentColor;transform:translateX(-8px);transition:left .25s cubic-bezier(.2,.8,.3,1)}
.lvl{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.lvl b{font-family:Unbounded,sans-serif;font-size:18px}
.lvl span{font-size:15px;opacity:.85}
.split{margin:14px 0 0;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--orange) 22%,transparent);font-size:16px;line-height:1.35}
.split b{font-family:Unbounded,sans-serif}
.split.bad{background:color-mix(in srgb,#d9412b 30%,transparent)}
.split small{display:block;margin-top:2px;opacity:.8}
.reset{border:0;background:none;padding:10px 0;font-weight:700;text-decoration:underline;cursor:pointer;font-size:15px}
.reset[hidden]{display:none}
.help{display:inline-flex;align-items:center;gap:8px;margin-top:12px;font-weight:700;font-size:15px}

/* ---------- A · Steppers: card with a sticky live result ---------- */
.A{border:2px solid var(--ink);border-radius:24px;overflow:clip}
.A .res{position:sticky;top:0;z-index:3;background:var(--ink);color:var(--paper);padding:16px 18px 18px}
.A .big{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.A .big .mg{font:800 54px/1 Unbounded,sans-serif;letter-spacing:-.04em}
.A .big .mg small{font-size:20px;letter-spacing:0}
.A .big .lbl{font-size:14px;font-weight:600;opacity:.8;display:block;margin-top:4px}
.A .big .tot{text-align:right;font-size:14px;opacity:.85}
.A .big .tot b{display:block;font:700 20px/1.1 Unbounded,sans-serif}
.A .res .lad{margin-top:22px}
.A .res .split{background:var(--orange);color:#1f1410}.A .res .split.bad{background:#d9412b;color:#fff}
.A .ins{padding:6px 18px 18px}
.A .row{padding:18px 0;border-bottom:1px solid var(--line)}
.A .row:last-child{border-bottom:0}

/* ---------- B · Target: pick the dose you want, get a plan ---------- */
.B .tgt{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.B .tgt button{min-height:76px;border:2px solid var(--ink);border-radius:18px;background:var(--paper);cursor:pointer;padding:6px 4px;line-height:1.1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.B .tgt button b{font:800 22px/1 Unbounded,sans-serif}
.B .tgt button b small{font-size:12px}
.B .tgt button span{font-size:12px;font-weight:700;color:var(--ink-2);overflow-wrap:anywhere}
.B .tgt button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.B .tgt button[aria-pressed=true] span{color:inherit;opacity:.8}
.B .now{margin:20px 0 0;padding:16px 18px;border-radius:20px;background:var(--chip)}
.B .now .lvl{margin-top:4px}
.B .now .row1{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.B .now .row1 b{font:800 30px/1 Unbounded,sans-serif;letter-spacing:-.03em}
.B .now .lad{margin:22px 0 6px}
.B .plan{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:10px}
.B .plan li{display:flex;gap:14px;align-items:center;padding:14px 16px;border:2px solid var(--ink);border-radius:20px}
.B .plan li.best{background:var(--orange);border-color:var(--orange);color:#1f1410}
.B .plan .n{width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font:800 15px Unbounded,sans-serif;flex:none}
.B .plan li.best .n{background:#1f1410;color:var(--orange)}
.B .plan b{display:block;font:700 19px/1.2 Unbounded,"PingFang SC",sans-serif}
.B .plan span{font-size:14px}
.B .plan li.off{opacity:.45}
.B details{margin-top:18px;border-top:2px solid var(--ink)}
.B summary{min-height:52px;display:flex;align-items:center;justify-content:space-between;font-weight:700;cursor:pointer;list-style:none}
.B summary::-webkit-details-marker{display:none}
.B .row{padding:10px 0 14px}

/* ---------- C · Sentence: the dose line IS the calculator ---------- */
.C .sent{font:700 26px/1.5 Unbounded,"PingFang SC","Noto Sans SC",sans-serif;letter-spacing:-.02em;margin:0;overflow-wrap:anywhere}
.C .tok{display:inline-flex;align-items:baseline;gap:4px;border:0;border-bottom:4px solid var(--orange);background:color-mix(in srgb,var(--orange) 16%,transparent);border-radius:10px 10px 0 0;padding:0 8px;margin:2px 0;font:inherit;cursor:pointer;line-height:1.25}
.C .tok:active{background:var(--orange)}
.C .eq{display:flex;align-items:flex-end;gap:12px;margin-top:12px;flex-wrap:wrap}
.C .eq .mg{font:800 58px/1 Unbounded,sans-serif;letter-spacing:-.04em}
.C .eq .mg small{font-size:22px;letter-spacing:0}
.C .eq span{font-weight:700;padding-bottom:6px}
.C .tap{font-size:14px;color:var(--ink-2);margin:6px 0 0}
.C.inhero{margin-top:4px;padding:16px 0 4px;border-top:2px solid var(--ink)}
.C.inhero .sent{font-size:21px}
.C.inhero .eq .mg{font-size:44px}
dialog.sheet{position:fixed;inset:auto 0 0;width:100%;max-width:680px;margin:0 auto;border:0;padding:0 20px max(20px,env(safe-area-inset-bottom));border-radius:28px 28px 0 0;background:var(--paper);color:var(--ink);box-shadow:0 -10px 40px rgba(0,0,0,.25)}
dialog.sheet::backdrop{background:rgba(20,12,8,.45)}
dialog.sheet[open]{animation:up .22s cubic-bezier(.2,.8,.3,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:10px auto 14px}
.sheet .live{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 16px;padding:12px 16px;border-radius:16px;background:var(--ink);color:var(--paper)}
.sheet .live b{font:800 30px/1 Unbounded,sans-serif}
.sheet .done{width:100%;margin-top:16px}

/* ---------- standalone calculator page ---------- */
.cp h1{padding-right:0;font-size:34px}
.cp .meta{font-size:14px;color:var(--ink-2);margin:0 0 10px}
.cp .intro{margin:0 0 22px;font-size:17px}
.cp .intro strong{font-weight:700}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);padding:0 8px 8px}
.tbl td{padding:12px 8px;border-top:1px solid var(--line);vertical-align:top}
.tbl td:first-child{border-left:6px solid var(--c);font-weight:700}
.tbl td:nth-child(2){white-space:nowrap;font-family:Unbounded,sans-serif;font-size:14px}
.tbl tr.you td{background:var(--chip)}
.tbl tr.you td:first-child::after{content:attr(data-you);display:block;margin-top:4px;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--orange)}
.formula{border:2px solid var(--ink);border-radius:20px;padding:18px}
.formula .f{font:800 26px/1.2 Unbounded,sans-serif;letter-spacing:-.02em;margin:0 0 10px}
.formula dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0 0 14px;font-size:15px}
.formula dt{font-family:Unbounded,sans-serif;font-weight:700}
.formula dd{margin:0}
.formula p{margin:8px 0 0;font-size:16px}
.formula .yours{padding-top:10px;border-top:1px solid var(--line)}
.rchips{display:flex;flex-wrap:wrap;gap:8px}
.rchips a{min-height:44px;display:inline-flex;align-items:center;padding:0 14px;border:2px solid var(--ink);border-radius:999px;font-weight:700;text-decoration:none;font-size:15px}
.faq details{border-top:1px solid var(--line)}
.faq summary{min-height:56px;display:flex;align-items:center;font-weight:700;cursor:pointer;padding:8px 0}
.faq p{margin:0 0 16px;color:var(--ink-2)}
.note{font-size:14px;color:var(--ink-2);margin-top:28px}

/* ---------- prototype switcher (deliberately off-brand) ---------- */
#bar{position:fixed;left:8px;right:8px;bottom:max(8px,env(safe-area-inset-bottom));z-index:99;background:#202124;color:#fff;border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;font:13px/1 -apple-system,system-ui,sans-serif;box-shadow:0 6px 24px rgba(0,0,0,.35)}
#bar .grp{display:flex;background:#3c4043;border-radius:9px;padding:2px}
#bar button{border:0;background:none;color:#e8eaed;padding:9px 9px;border-radius:7px;cursor:pointer;white-space:nowrap}
#bar button[aria-pressed=true]{background:#fff;color:#202124;font-weight:600}
#bar .vl{padding:9px 6px;color:#fff;font-weight:600}
body.shot #bar{display:none}
</style>
</head>
<body>
<div id="app"></div>
<div id="bar" role="toolbar" aria-label="Prototype controls"></div>
<script>
const ROOT = "../../";
const P = new URLSearchParams(location.search);
const S = { v: P.get("v") || "A", page: P.get("page") || "recipe", r: P.get("r") || "pot-brownies", lang: P.get("lang") || "en", theme: P.get("theme") || "light" };
if (P.has("shot")) document.body.classList.add("shot");
const VARIANTS = { A: "Steppers + sticky result", B: "Target dose → plan", C: "Sentence (dose line is the calculator)" };
const RECIPES = [["pot-brownies", "Brownies 16mg"], ["cannabutter", "Butter 20mg"], ["infused-spaghetti-bolognese", "Bolognese 70mg"]];

const CAT = { Desserts: ["#f27242", "#c9532a", "cupcake"], Essentials: ["#f4c542", "#d89f12", "butter"], Lunch: ["#d9b38c", "#a8835a", "bowl"], Drinks: ["#62b6e8", "#2f86bd", "glass"], Snacks: ["#f29cb7", "#d4668a", "cupcake"], Keto: ["#b3a1e6", "#7f69c4", "bowl"], Vegan: ["#5cc48a", "#2f9660", "bowl"], International: ["#3fb5b0", "#1f8580", "bowl"] };
const G = {

  butter: '<path class="gl" d="M10 46 34 30h56L66 46Z"/><path class="gl" d="M10 46h56v28H10Z"/><path class="gl" d="M66 46 90 30v28L66 74Z" opacity=".75"/><path class="gl-l" d="M30 46v28M46 46v28"/>',
  glass: '<path class="gl" d="M24 24h52l-7 70H31Z"/><path class="gl-l" d="M27 46h46" />',

};
const I = {
  search: '<svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  menu: '<svg class="icon" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg>',
  minus: '<svg class="icon" viewBox="0 0 24 24"><path d="M6 12h12"/></svg>',
  plus: '<svg class="icon" viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg>',
  down: '<svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></svg>',
  chev: '<svg class="icon" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>',
  life: '<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path d="m5.6 5.6 3.6 3.6M14.8 14.8l3.6 3.6M18.4 5.6l-3.6 3.6M9.2 14.8l-3.6 3.6"/></svg>',
};

// New UI strings (drafts). Questions, the 6 dose levels, page copy and the safety note come from i18n/{lang}.json.
const T = {
  en: { per: "per serving", mgPer: "mg per serving", batch: "Whole batch", at: "at", thc: "THC", g: "g", serv: (n) => (n == 1 ? "serving" : "servings"),
        adjust: "Adjust dose", jump: "Jump to recipe", calc: "Your dose", reset: "Reset to this recipe", resetC: "Reset",
        beg: "New to edibles? Start with 2.5–5 mg and wait 2 hours before having more.", begL: "Beginner's guide", help: "Too high? Get help now",
        split: (f, t) => `For ${t} mg, eat <b>${f}</b> of a serving`, cut: (n) => `or cut the batch into ${n} servings`,
        tooStrong: "Too strong to split by eye. Use less cannabis or make more servings.",
        target: "How strong should each serving be?", now: "This batch as set", plan: "Your plan",
        p1: (g) => `Use ${g} g of cannabis`, p1s: (n, s) => `same ${n} servings, same ${s}% THC`,
        p2: (n) => `Cut into ${n} servings`, p2s: (g) => `keep the ${g} g`,
        p3: (f) => `Eat ${f} of a serving`, p3s: "already cooked it", p3x: "can't split this small",  p1x: "too little to weigh at home",
        edit: "Your cannabis", sent: (g, s, n) => `${g} of cannabis at ${s}, split into ${n}`, each: "each", tap: "Tap an orange number to change it.",
        done: "Done", ing: "Ingredients", steps: "Steps", you: "You", formulaT: "The formula", yours: "Your numbers", example: "Example",
        gL: "grams of cannabis", sL: "THC percentage", nL: "number of servings", pL: "mg of THC per serving",
        exText: "3.5 g of 20% cannabis split into 20 servings = 35 mg each.", oz: ["⅛ oz", "¼ oz", "½ oz", "1 oz"], avg: "average", recipeChip: "Recipe",
        faq: "Frequently asked questions" },
  pt: { per: "por porção", mgPer: "mg por porção", batch: "Receita toda", at: "com", thc: "THC", g: "g", serv: (n) => (n == 1 ? "porção" : "porções"),
        adjust: "Ajustar dose", jump: "Ir para a receita", calc: "Sua dose", reset: "Voltar ao da receita", resetC: "Zerar",
        beg: "Primeira vez? Comece com 2,5–5 mg e espere 2 horas antes de comer mais.", begL: "Guia para iniciantes", help: "Passou do ponto? Ajuda agora",

const FAQ = [ // the page's existing FAQ (English shown for every language in the prototype)
  ["How many mg of THC should a beginner take in an edible?", "Beginners should start with 2.5–5 mg of THC. Wait at least 2 hours before taking more, as edibles take longer to kick in than smoking."],

// ---------- the one formula + the one dose ladder (the calculator page's table) ----------
const mgOf = (x) => (10 * x.g * x.s) / x.n;
const LEVELS = [["microdose", 0, 2.5, "#8fd6a9"], ["beginner", 2.5, 5, "#5cc48a"], ["casual", 5, 15, "#f4c542"], ["experienced", 15, 30, "#f29a42"], ["high", 30, 50, "#f27242"], ["extreme", 50, 80, "#d9412b"]];
const RANGES = ["1–2.5 mg", "2.5–5 mg", "5–15 mg", "15–30 mg", "30–50 mg", "50+ mg"];
const lvlIdx = (mg) => { const i = LEVELS.findIndex((l) => mg <= l[2]); return i < 0 ? 5 : i; };
const FRACS = [[1 / 2, "½"], [1 / 3, "⅓"], [1 / 4, "¼"], [1 / 6, "⅙"], [1 / 8, "⅛"], [1 / 10, "1/10"], [1 / 12, "1/12"]];
const fracFor = (mg, t) => FRACS.find(([f]) => f <= t / mg)?.[1]; // round DOWN: the piece is never bigger than the target
const LIM = { g: [0.1, 28, 0.5], s: [1, 99, 1], n: [1, 200, 1] };
const clamp = (k, v) => Math.min(LIM[k][1], Math.max(LIM[k][0], v));

// ---------- state ----------
let D, R, x, def, target = 5, tok = P.get("tok") || "";
const nf = (v, d) => new Intl.NumberFormat(S.lang === "zh" ? "zh-CN" : S.lang, { maximumFractionDigits: d }).format(v);
const fmtMg = (mg) => nf(mg, mg >= 10 ? 0 : 1);
const fmtG = (g) => nf(g, g < 1 ? 2 : 1);
const parse = (s) => parseFloat(String(s).replace(",", "."));
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

async function load() {
  const j = (p) => fetch(ROOT + p).then((r) => r.json());
  const [rec, ui, tr, txt] = await Promise.all([j("data/recipes.json"), j(`i18n/${S.lang}.json`), S.lang === "en" ? null : j(`i18n/recipes_${S.lang}.json`), j("data/recipes_text.json")]);
  D = { rec, ui, tr, txt, c: ui.calculator, lang: S.lang };
}
function pickRecipe() {
  R = D.rec.recipes.find((r) => r.slug === S.r);
  def = S.page === "calc" ? { g: 3.5, s: 14, n: 50 } : { g: +R.suggested_quantity, s: 14, n: +R.suggested_portion }; // today's defaults
  x = { ...def, ...(P.has("g") ? { g: +P.get("g") } : {}), ...(P.has("s") ? { s: +P.get("s") } : {}), ...(P.has("n") ? { n: +P.get("n") } : {}) };
}

// ---------- shared pieces ----------
const t = () => T[S.lang];
const lvlName = (i) => D.c["dosage_" + LEVELS[i][0]];
const lvlDesc = (i) => D.c["dosage_" + LEVELS[i][0] + "_desc"];
const unit = (k) => (k === "g" ? t().g : k === "s" ? "% " + t().thc : t().serv(x.n));
const Q = (k) => (k === "g" ? D.c.weed_quantity : k === "s" ? D.c.weed_strength : D.c.portions_question);

function presets(k) {
  const c = D.c;
  if (k === "g") return [[3.5, t().oz[0]], [7, t().oz[1]], [14, t().oz[2]], [28, t().oz[3]]].map(([v, l]) => [v, `${fmtG(v)} g`, l]);
  if (k === "s") return [[8, c.potency_low], [14, t().avg], [22, c.potency_high], [60, c.potency_concentrates]].map(([v, l]) => [v, `${v}%`, l]);
  const base = S.page === "recipe" ? [[def.n, String(def.n), t().recipeChip]] : [];
  return base.concat([12, 24, 50].filter((v) => v !== def.n).map((v) => [v, String(v), ""]));
}
const chipRow = (k) => `<div class="chips" role="group" aria-label="${esc(Q(k))}">${presets(k).map(([v, a, b]) => `<button type="button" class="chip" data-k="${k}" data-v="${v}" aria-pressed="${x[k] === v}">${a}${b ? `<small>${esc(b)}</small>` : ""}</button>`).join("")}</div>`;
const field = (k, id = "") => `<div class="stepper"><button type="button" class="rnd" data-step="${k}" data-d="-1" aria-label="−">${I.minus}</button>
  <label class="fld"><input ${id ? `id="${id}"` : ""} data-in="${k}" inputmode="decimal" enterkeyhint="done" autocomplete="off" value="${k === "g" ? fmtG(x.g) : x[k]}" aria-label="${esc(Q(k))}"><span class="u" data-unit="${k}">${unit(k)}</span></label>
  <button type="button" class="rnd" data-step="${k}" data-d="1" aria-label="+">${I.plus}</button></div>`;

function ladder(mg) {
  const i = lvlIdx(mg), [, lo, hi] = LEVELS[i], pos = ((i + Math.min(1, Math.max(0, (mg - lo) / (hi - lo)))) / 6) * 100;
  return `<div class="lad" aria-hidden="true">${LEVELS.map((l, j) => `<i style="--c:${l[3]}" class="${j === i ? "on" : ""}"></i>`).join("")}<span class="mk" style="left:${pos}%"></span></div>
    <div class="lvl"><b>${lvlName(i)}</b><span>${RANGES[i]} · ${lvlDesc(i)}</span></div>`;
}
function splitLine(mg, tg = 5) {
  if (mg <= tg * 1.05) return "";
  const f = fracFor(mg, tg), cut = Math.ceil((10 * x.g * x.s) / tg);
  return f ? `<p class="split">${t().split(f, nf(tg, 1))}<small>${t().cut(cut)}</small></p>` : `<p class="split bad">${t().tooStrong}<small>${t().cut(cut)}</small></p>`;
}
const begLine = () => `<p class="beg"><span class="hl">${t().beg}</span> <a href="#">${t().begL}</a></p>`;
const helpLink = () => `<a class="help" href="https://bit.ly/helpimhavingabadtrip" target="_blank" rel="noopener">${I.life}${t().help}</a>`;
const edited = () => x.g !== def.g || x.s !== def.s || x.n !== def.n;
const resetBtn = () => `<button type="button" class="reset" data-reset ${edited() ? "" : "hidden"}>${S.page === "recipe" ? t().reset : t().resetC}</button>`;

// ---------- A · Steppers + sticky live result ----------

// ---------- B · Target dose → plan ----------
function B() {
  const tg = [2.5, 5, 10, 20];
  return `<div class="B"><p class="q">${t().target}</p><div class="tgt" role="group">${tg.map((v) => `<button type="button" data-tgt="${v}" aria-pressed="${target === v}"><b>${nf(v, 1)}<small>mg</small></b><span>${lvlName(lvlIdx(v))}</span></button>`).join("")}</div>
    <div id="live"></div>
    <details ${S.page === "calc" ? "open" : ""}><summary>${t().edit}: <span data-o="sum"></span>${I.chev}</summary>
      ${["g", "s", "n"].map((k) => `<div class="row"><label class="q">${esc(Q(k))}</label>${field(k)}${chipRow(k)}</div>`).join("")}${resetBtn()}</details></div>`;
}
function liveB() {
  const mg = mgOf(x), g1 = (target * x.n) / (10 * x.s), n2 = Math.ceil((10 * x.g * x.s) / target), f = fracFor(mg, target);
  const ok = mg <= target * 1.05;
  const weighable = g1 >= 0.2; // a kitchen scale reads 0.1 g; below 0.2 g the error is ±50%
  const plan = ok ? "" : `<p class="q" style="margin:20px 0 0">${t().plan}</p><ol class="plan">
    <li class="${weighable ? "best" : "off"}"><span class="n">1</span><div><b>${t().p1(g1 < 0.1 ? "< " + fmtG(0.1) : fmtG(g1))}</b><span>${weighable ? t().p1s(x.n, nf(x.s, 1)) : t().p1x}</span></div></li>
    <li class="${weighable ? "" : "best"}"><span class="n">2</span><div><b>${t().p2(n2)}</b><span>${t().p2s(fmtG(x.g))}</span></div></li>
    <li class="${f ? "" : "off"}"><span class="n">3</span><div><b>${f ? t().p3(f) : t().p3(`1/${Math.round(mg / target)}`)}</b><span>${f ? t().p3s : t().p3x}</span></div></li></ol>`;
  return `<div class="now"><div class="row1"><span>${t().now}</span><b>${fmtMg(mg)} mg</b></div>${ladder(mg)}</div>${plan}`;
}

// ---------- C · Sentence: tap an orange number ----------
const tokBtn = (k) => `<button type="button" class="tok" data-tok="${k}"><span data-o="${k}">${k === "g" ? fmtG(x.g) + " " + t().g : k === "s" ? x.s + "% " + t().thc : x.n + " " + t().serv(x.n)}</span></button>`;
function C(inhero) {

function openSheet(k) {

// ---------- live update (never re-renders the inputs, so focus and the keyboard stay put) ----------
function liveAll() {
  const mg = mgOf(x), set = (o, h) => document.querySelectorAll(`[data-o="${o}"]`).forEach((e) => (e.innerHTML = h));
  const live = document.getElementById("live");
  if (live) live.innerHTML = S.v === "A" ? liveA() : S.v === "B" ? liveB() : liveC();
  set("mg", `${fmtMg(mg)} mg`);
  set("mgs", `${fmtMg(mg)}<small>mg</small>`);
  set("batch", `${fmtMg(mg * x.n)} mg`);
  set("gs", `${fmtG(x.g)} g ${t().at} ${nf(x.s, 1)}% ${t().thc}`);
  set("sum", `${fmtG(x.g)} g · ${nf(x.s, 1)}% · ${x.n}`);
  set("g", `${fmtG(x.g)} ${t().g}`); set("s", `${nf(x.s, 1)}% ${t().thc}`); set("n", `${x.n} ${t().serv(x.n)}`);
  set("yours", `10 × ${fmtG(x.g)} × ${nf(x.s, 1)} ÷ ${x.n} = <b>${nf(mg, 1)} mg</b>`);
  document.querySelectorAll("[data-unit=n]").forEach((e) => (e.textContent = t().serv(x.n)));
  document.querySelectorAll("[data-in]").forEach((i) => { if (i !== document.activeElement) i.value = i.dataset.in === "g" ? fmtG(x.g) : nf(x[i.dataset.in], 1); });
  document.querySelectorAll(".chip[data-k]").forEach((b) => b.setAttribute("aria-pressed", x[b.dataset.k] === +b.dataset.v));
  document.querySelectorAll("[data-reset]").forEach((b) => (b.hidden = !edited()));
  document.getElementById("sticker")?.classList.toggle("edited", edited());
  document.querySelectorAll("tr[data-lvl]").forEach((r) => r.classList.toggle("you", +r.dataset.lvl === lvlIdx(mg)));
}

function bar() {
  const b = (k, v, l) => `<button data-set="${k}" data-v="${v}" aria-pressed="${S[k] === v}">${l}</button>`;
  const ks = Object.keys(VARIANTS);
  return `<div class="grp">${ks.map((k) => b("v", k, k)).join("")}</div><span class="vl">${VARIANTS[S.v]}</span>
    <div class="grp">${b("page", "recipe", "Recipe")}${b("page", "calc", "Calc page")}</div>
    ${S.page === "recipe" ? `<div class="grp">${RECIPES.map(([s, l]) => b("r", s, l)).join("")}</div>` : ""}
    <div class="grp">${b("theme", "light", "Light")}${b("theme", "dark", "Dark")}</div><div class="grp">${["en", "pt", "de", "zh"].map((l) => b("lang", l, l === "zh" ? "中文" : l.toUpperCase())).join("")}</div>`;
}
async function render() {
  if (!D || D.lang !== S.lang) await load();
  pickRecipe();
  document.documentElement.lang = S.lang === "zh" ? "zh-Hans" : S.lang;
  document.documentElement.dataset.theme = S.theme;
  document.getElementById("app").innerHTML = `<div class="wrap">${masthead()}<main>${S.page === "recipe" ? recipePage() : calcPage()}</main></div><footer class="ftr"><div class="wrap">Footer (navigation ticket)</div></footer>`;
  history.replaceState(null, "", "?" + new URLSearchParams(S));
  document.getElementById("bar").innerHTML = bar();
  liveAll();
  if (tok && S.v === "C") openSheet(tok);
  if (P.has("scroll")) document.getElementById(P.get("scroll"))?.scrollIntoView({ behavior: "instant" });
}

// ---------- events ----------
function setK(k, v) { if (!isFinite(v)) return; x[k] = k === "n" ? Math.round(clamp(k, v)) : Math.round(clamp(k, v) * 100) / 100; liveAll(); }
document.addEventListener("input", (e) => { const k = e.target.dataset.in; if (k) { const v = parse(e.target.value); if (v > 0) setK(k, v); } });
document.addEventListener("change", (e) => { if (e.target.dataset.in) { e.target.blur(); liveAll(); } });
document.addEventListener("keydown", (e) => {
  if (e.target.dataset?.in && e.key === "Enter") e.target.blur();
  if (e.target.closest("input,textarea,[contenteditable]")) return;
  if (e.key === "ArrowLeft" || e.key === "ArrowRight") { const ks = Object.keys(VARIANTS), i = ks.indexOf(S.v); S.v = ks[(i + (e.key === "ArrowRight" ? 1 : ks.length - 1)) % ks.length]; render(); }
});
document.addEventListener("click", (e) => {
  const set = e.target.closest("[data-set]"); if (set) { S[set.dataset.set] = set.dataset.v; tok = ""; return render(); }
  const st = e.target.closest("[data-step]"); if (st) { const k = st.dataset.step, step = LIM[k][2] * +st.dataset.d; return setK(k, k === "g" ? Math.round((x.g + step) / LIM.g[2]) * LIM.g[2] || LIM.g[0] : x[k] + step); }
  const ch = e.target.closest(".chip[data-k]"); if (ch) return setK(ch.dataset.k, +ch.dataset.v);
  const tg = e.target.closest("[data-tgt]"); if (tg) { target = +tg.dataset.tgt; document.querySelectorAll("[data-tgt]").forEach((b) => b.setAttribute("aria-pressed", b === tg)); return liveAll(); }
  if (e.target.closest("[data-reset]")) { x = { ...def }; return liveAll(); }
  const tk = e.target.closest("[data-tok]"); if (tk) return openSheet(tk.dataset.tok);
  if (e.target.closest("[data-done]")) return document.getElementById("sheet").close();
  if (e.target.id === "sheet") return e.target.close(); // tap on backdrop
});
render();
</script>
