<!doctype html>
<!-- PROTOTYPE — throwaway. Answers part of "What do the articles and the remaining pages look like in the new shape?":
     calculator.html (whole page), articles.html, contact.html, 404.html, about.html in the C · Poster identity.
     Branch prototype/pages only. `python3 -m http.server 8767` from repo root, then /_prototype-pages/
     Params: page=calc|articles|contact|404|about  lang=en|pt|de|zh  theme=light|dark  fold=1  shot=1
             v=list|cards (articles index)  v404=poster|art (404)  sent=1 (contact)  path=/some/missing/url (404)  mini=1  scroll=<id>&dy=<px> -->
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>PROTOTYPE · remaining pages</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500..800&display=swap">
<style>
/* ---------- Poster tokens (visual direction ticket) ---------- */
:root{--paper:#fff;--ink:#1f1410;--ink-2:#6a5a50;--orange:#f27242;--on-cat:#1f1410;--line:#ecdfd6;--chip:#f6eee9;--focus:#1f1410;--mark:color-mix(in srgb,var(--orange) 70%,transparent);--res-top:0px;color-scheme:light}
[data-theme=dark]{--paper:#191210;--ink:#f7ede6;--ink-2:#bba89b;--line:#3a2c26;--chip:#2a1f1b;--focus:#f27242;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:72px}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:Unbounded,"PingFang SC","Hiragino Sans GB","Noto Sans SC",sans-serif;overflow-wrap:break-word}
:lang(de) h1,:lang(de) h2,:lang(de) h3{hyphens:auto;-webkit-hyphens:auto}
.wrap{max-width:680px;margin:0 auto;padding:0 20px}
.icon{width:24px;height:24px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}html{scroll-behavior:auto}}

/* colour pairs: the build emits --cat-lt/--deep-lt/--cat-dk/--deep-dk inline, CSS picks (recipe-final finding) */
.cv,.band,.tone{--cat:var(--cat-lt);--cat-deep:var(--deep-lt)}
[data-theme=dark] .cv,[data-theme=dark] .band,[data-theme=dark] .tone{--cat:var(--cat-dk);--cat-deep:var(--deep-dk)}
.cv{display:block;position:relative;overflow:hidden;background:var(--cat);color:var(--on-cat);contain:paint}
.cv>svg{position:absolute;aspect-ratio:1;width:var(--gs);right:var(--gx);bottom:var(--gy);transform:rotate(var(--gr))}

/* ---------- shell (navigation ticket) ---------- */
.hdr{display:flex;align-items:center;justify-content:space-between;height:108px}
.hdr .logo{height:auto;width:min(240px,calc(100vw - 40px - 116px))}
.tools{display:flex;gap:8px}
.ibtn{width:48px;height:48px;display:grid;place-items:center;border:2px solid var(--ink);border-radius:50%;background:var(--paper)}
.mini{position:fixed;inset:0 0 auto;z-index:20;background:var(--paper);border-bottom:2px solid var(--ink);transform:translateY(-105%);transition:transform .22s ease}
body.mini-on .mini{transform:none}
.mini .wrap{display:flex;align-items:center;justify-content:space-between;height:60px;gap:12px}
.mini .logo{height:40px;width:auto}
.mini .ibtn{width:44px;height:44px}
.mini .spill{flex:1;display:flex;align-items:center;gap:8px;height:44px;border:2px solid var(--ink);border-radius:999px;padding:0 14px;background:var(--chip);font-size:15px;color:var(--ink-2);min-width:0;white-space:nowrap;overflow:hidden}
.ftr{margin-top:72px;background:var(--orange);color:#1f1410;padding:28px 0 140px}
.ftr .cols{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px}
.ftr h4{font-family:Unbounded,"PingFang SC",sans-serif;font-size:14px;margin:22px 0 4px;grid-column:1/-1}
.ftr .cols a{display:block;padding:9px 0;font-weight:700;text-decoration:none;font-size:16px}
.ftr .langs{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.ftr .langs a{border:2px solid #1f1410;border-radius:999px;padding:8px 14px;font-weight:700;text-decoration:none;font-size:15px}
.ftr .langs a[aria-current]{background:#1f1410;color:#f27242}
.ftr p{font-size:14px;margin:22px 0 0}

/* ================= NEW: the poster band — every non-recipe page's header =================
   A colour block like a category cover, but the "glyph" is an oversized, cropped typographic mark
   (404, 2017, @, mg, 50) in --cat-deep. Same crop/rotation logic as the covers, no images. */
.band{position:relative;overflow:hidden;contain:paint;background:var(--cat);color:#1f1410;margin:0 -20px;padding:22px 20px 26px;min-height:var(--band-h,0)}
.band .mk{position:absolute;right:var(--mx,-.06em);bottom:var(--my,-.2em);font:800 var(--ms,220px)/.78 Unbounded,sans-serif;letter-spacing:-.06em;color:var(--cat-deep);transform:rotate(var(--mr,-7deg));transform-origin:100% 100%;white-space:nowrap;pointer-events:none;user-select:none}
.band>*:not(.mk){position:relative}
.eyebrow{display:inline-block;font-size:13px;font-weight:700;letter-spacing:.02em;border:2px solid #1f1410;border-radius:999px;padding:5px 12px;background:color-mix(in srgb,var(--cat) 82%,transparent);text-decoration:none}
.band h1{font-weight:800;font-size:clamp(30px,9vw,40px);line-height:1.04;letter-spacing:-.03em;margin:16px 0 10px;max-width:15ch}
:lang(zh) .band h1{font-weight:900;letter-spacing:0;line-height:1.18}
.band .deck{margin:0;font-size:16px;line-height:1.45;max-width:30ch;font-weight:500}
.band .meta{margin:12px 0 0;font-size:13px;font-weight:700;opacity:.8}
.band.over{padding-bottom:58px}   /* the calculator card overlaps the band's bottom 34px */
@media (min-width:1000px){.band.over{padding-bottom:44px}}

/* ================= reading column + prose (also the base of the article legacy-compat block) ================= */
.prose{font-size:18px;line-height:1.62}
.prose>*:first-child{margin-top:0}
.prose p{margin:0 0 16px}
.prose h2{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.15;margin:44px 0 12px}
.prose h3{font-size:19px;font-weight:700;line-height:1.25;margin:28px 0 8px}
.prose a{font-weight:600;text-decoration-thickness:2px;text-underline-offset:3px;text-decoration-color:var(--orange)}
.prose ul,.prose ol{padding-left:24px;margin:0 0 18px}
.prose li{margin:0 0 8px}
.prose li::marker{color:var(--orange);font-weight:800}
.prose strong{font-weight:700}
.lede{font-size:19px;line-height:1.5;color:var(--ink-2);margin:26px 0 0}
section.block{margin-top:48px}
.block>h2,.bh h2{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:0}
.bh{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:6px}
.hint{font-size:15px;color:var(--ink-2);margin:6px 0 14px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:6px 18px;border:2px solid var(--ink);border-radius:16px;font-weight:700;text-decoration:none;background:var(--paper);line-height:1.15;text-align:center;font-size:16px;cursor:pointer}
.btn.pri{background:var(--orange);color:#1f1410;border-color:#1f1410}
.btn .icon{width:20px;height:20px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.box{border:2px solid var(--ink);border-radius:20px;padding:16px 18px;margin:22px 0}
.box h3{margin:0 0 6px;font-size:17px;display:flex;align-items:center;gap:8px}
.box h3 .icon{color:var(--orange)}
.box p{margin:0;font-size:16px;line-height:1.5}
.help{display:inline-flex;align-items:center;gap:8px;margin-top:14px;font-weight:700;font-size:15px}
.acc{border-top:2px solid var(--ink)}
.acc:last-of-type{border-bottom:2px solid var(--ink)}
.acc summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px;padding:12px 0;cursor:pointer;font-weight:700;font-size:17px;line-height:1.3}
.acc summary::-webkit-details-marker{display:none}
.acc summary .pm{flex:none;width:32px;height:32px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;transition:transform .2s}
.acc[open] summary .pm{transform:rotate(45deg);background:var(--ink);color:var(--paper)}
.acc .body{padding:0 0 16px}
.acc .body p{margin:0;color:var(--ink-2);font-size:16px}

/* ================= CALCULATOR card (calculator ticket A · Steppers, recipe-final peek rule) ================= */
.calc{border:2px solid var(--ink);border-radius:24px;overflow:clip;background:var(--paper)}
.res{position:relative;z-index:3;background:var(--ink);color:var(--paper);padding:16px 18px 18px}
.big{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.big .mg{font:800 54px/1 Unbounded,sans-serif;letter-spacing:-.04em;white-space:nowrap}
.big .mg small{font-size:20px;letter-spacing:0}
.big .lbl{font-size:14px;font-weight:600;opacity:.8;display:block;margin-top:4px}
.big .tot{text-align:right;font-size:14px;opacity:.85}
.big .tot b{display:block;font:700 20px/1.1 Unbounded,sans-serif;white-space:nowrap}
.lad{position:relative;display:flex;gap:3px;height:14px;margin:22px 0 8px}
.lad i{flex:1;border-radius:4px;background:var(--c);opacity:.35}
.lad i.on{opacity:1}
.lad .mk{position:absolute;top:-18px;width:0;height:0;border:8px solid transparent;border-top:12px solid currentColor;transform:translateX(-8px);transition:left .25s cubic-bezier(.2,.8,.3,1)}
.lvl{display:flex;gap:4px 10px;align-items:baseline;flex-wrap:wrap}
.lvl b{font-family:Unbounded,"PingFang SC",sans-serif;font-size:18px}
.lvl span{font-size:15px;opacity:.85}
.split{margin:14px 0 0;padding:12px 14px;border-radius:14px;background:var(--orange);color:#1f1410;font-size:16px;line-height:1.35}
.split b{font-family:Unbounded,"PingFang SC",sans-serif}
.split small{display:block;margin-top:2px;opacity:.8}
.split.bad{background:#d9412b;color:#fff}
.ins{padding:6px 18px 14px}
.row{padding:18px 0;border-bottom:1px solid var(--line)}
.row:last-of-type{border-bottom:0}
.q{display:block;font-weight:700;font-size:17px;line-height:1.25;margin:0 0 8px}
.stepper{display:flex;align-items:center;gap:10px}
.rnd{width:52px;height:52px;flex:none;border:2px solid var(--ink);border-radius:50%;background:var(--paper);display:grid;place-items:center;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.rnd:active{background:var(--ink);color:var(--paper)}
.fld{flex:1;min-width:0;display:flex;align-items:baseline;justify-content:center;gap:6px;height:60px;border:2px solid var(--ink);border-radius:16px;padding:0 12px;background:var(--paper);cursor:text}
.fld:focus-within{box-shadow:0 0 0 3px color-mix(in srgb,var(--orange) 60%,transparent)}
.fld input{width:100%;min-width:0;border:0;background:none;outline:none;text-align:right;font:800 28px/58px Unbounded,sans-serif;letter-spacing:-.02em;padding:0}
.fld .u{flex:none;font-weight:700;font-size:15px;color:var(--ink-2);min-width:3.6em}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:10px -18px 0;padding:2px 18px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:44px;border:2px solid var(--line);border-radius:999px;padding:0 14px;background:var(--paper);font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;line-height:1.1;display:inline-flex;flex-direction:column;justify-content:center;text-decoration:none}
.chip small{display:block;font-weight:600;font-size:12px;color:var(--ink-2)}
.chip[aria-pressed=true],.chip:has(input:checked){border-color:var(--ink);background:var(--ink);color:var(--paper)}
.chip[aria-pressed=true] small{color:inherit;opacity:.75}
.cfoot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 14px;padding:12px 18px 16px;border-top:1px solid var(--line);font-size:15px;font-weight:700}
.reset{border:0;background:none;padding:6px 0;font-weight:700;text-decoration:underline;cursor:pointer;font-size:15px;color:var(--orange)}
.reset[hidden]{display:none}
.beg{margin:14px 0 0;font-size:15px}
.beg .hl{background:linear-gradient(transparent 55%,color-mix(in srgb,var(--orange) 45%,transparent) 55%)}
.beg a{font-weight:700}
.peek{display:flex;position:sticky;top:var(--res-top);z-index:4;height:56px;margin-bottom:-56px;align-items:center;justify-content:space-between;gap:10px;padding:0 18px;background:var(--ink);color:var(--paper);opacity:0;pointer-events:none;transition:opacity .15s,top .22s ease;box-shadow:inset 0 -5px 0 var(--lc,#f4c542)}
.calc.peeking .peek{opacity:1;pointer-events:auto}
.peek b{font:800 26px/1 Unbounded,sans-serif;letter-spacing:-.03em;white-space:nowrap}
.peek b small{font-size:13px;letter-spacing:0}
.peek span{font-size:14px;font-weight:700;text-align:right;line-height:1.2;min-width:0}
.peek span small{display:block;font-weight:500;opacity:.8}
body.mini-on{--res-top:62px}
#dose{scroll-margin-top:16px;margin-top:-34px;position:relative;z-index:2}   /* the card overlaps the band's bottom edge: tool first */

/* dose table = the 6-level ladder as a table (static HTML, row highlighted live) */
.dt{width:100%;border-collapse:collapse;font-size:15px;line-height:1.35;margin-top:10px}
.dt th{text-align:left;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);padding:0 8px 8px;border-bottom:2px solid var(--ink)}
.dt td{padding:12px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.dt td:first-child{padding-left:14px;position:relative;font-weight:700;white-space:nowrap}
.dt td:first-child::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:6px;border-radius:3px;background:var(--c)}
.dt td:nth-child(2){font-family:Unbounded,sans-serif;font-weight:700;font-size:14px;white-space:nowrap}
.dt td:last-child{color:var(--ink-2)}
.dt tr[aria-current] td{background:var(--ink);color:var(--paper)}
.dt tr[aria-current] td:first-child{border-radius:12px 0 0 12px}
.dt tr[aria-current] td:last-child{border-radius:0 12px 12px 0;color:color-mix(in srgb,var(--paper) 85%,var(--ink))}
/* phone: level + mg on one line, what-to-expect underneath (still a real <table> in the HTML) */
@media (max-width:639px){
  .dt thead{display:none}
  .dt tr{display:grid;grid-template-columns:1fr auto;position:relative;padding:12px 10px 12px 18px;border-bottom:1px solid var(--line);border-radius:14px}
  .dt tr::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:6px;border-radius:3px;background:var(--c)}
  .dt td,.dt td:first-child{padding:0;border:0;background:none!important;border-radius:0!important}
  .dt td:first-child::before{content:none}
  .dt td:last-child{grid-column:1/-1;margin-top:4px;font-size:15px}
  .dt tr[aria-current]{background:var(--ink);color:var(--paper);border-color:transparent}
  .dt tr[aria-current]::before{left:6px}
}
.dt .you{display:inline-block;margin-left:6px;font:700 11px/1 -apple-system,sans-serif;background:var(--c);color:#1f1410;padding:3px 6px;border-radius:999px;vertical-align:2px}
:lang(zh) .dt th{text-transform:none}

/* the formula as a poster */
.fx{background:var(--ink);color:var(--paper);border-radius:24px;padding:20px 18px 18px;margin-top:14px}
.fx .eq{font:800 clamp(19px,5.3vw,30px)/1.15 Unbounded,sans-serif;letter-spacing:-.02em;display:flex;flex-wrap:wrap;gap:0 .28em;align-items:baseline}
.fx .eq i{font-style:normal;color:var(--orange)}
.fx dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:16px 0 0;font-size:15px}
.fx dt{font:800 15px/1.4 Unbounded,sans-serif;color:var(--orange)}
.fx dd{margin:0;opacity:.88}
.ex{border:2px solid var(--ink);border-radius:20px;padding:14px 16px;margin-top:12px}
.ex small{display:block;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)}
.ex p{margin:4px 0 0;font:700 17px/1.4 Unbounded,"PingFang SC",sans-serif}
.ex p b{color:var(--orange);white-space:nowrap}
.ex.live{border-style:dashed}
.steps{list-style:none;counter-reset:s;margin:12px 0 0;padding:0}
.steps li{counter-increment:s;display:flex;gap:14px;padding:12px 0;border-top:1px solid var(--line);font-size:17px;line-height:1.45}
.steps li::before{content:counter(s);flex:none;width:36px;height:36px;border-radius:50%;background:var(--orange);color:#1f1410;display:grid;place-items:center;font:800 15px/1 Unbounded,sans-serif}

/* THE card (homepage ticket) */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 14px;margin-top:14px}
.card{text-decoration:none;display:block;min-width:0}
.card .cv{aspect-ratio:1;border-radius:20px}
.card .dot{position:absolute;right:8px;bottom:8px;z-index:1;min-width:52px;height:52px;padding:0 6px;border-radius:50%;background:var(--ink);color:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-8deg);line-height:1;box-shadow:0 0 0 3px var(--cat)}
.card .dot b{font-family:Unbounded,sans-serif;font-size:16px;font-weight:800;letter-spacing:-.03em}
.card .dot small{font-size:10px;font-weight:700}
.card .nm{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:700;font-size:16px;line-height:1.25;margin-top:8px}

/* ================= ARTICLES INDEX ================= */
.asearch{display:flex;align-items:center;gap:10px;height:56px;border:2px solid var(--ink);border-radius:999px;padding:0 18px;background:var(--paper);margin-top:-28px;position:relative;z-index:2;box-shadow:0 6px 0 var(--ink)}
.asearch input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:17px;height:100%}
.topics{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:18px -20px 0;padding:2px 20px}
.topics::-webkit-scrollbar{display:none}
.topics .chip{border-color:var(--ink);gap:0}
.topics .chip i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--cat);margin-right:6px;font-style:normal}
.topics .chip span{display:inline-flex;align-items:center}
.topics .chip em{font-style:normal;font-weight:600;opacity:.6;margin-left:5px}
.count{font-size:14px;font-weight:700;color:var(--ink-2);margin:14px 0 0}
.start{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.start a{position:relative;overflow:hidden;contain:paint;display:flex;flex-direction:column;justify-content:flex-end;min-height:150px;border-radius:20px;padding:14px;background:var(--cat);color:#1f1410;text-decoration:none}
.start a .n{position:absolute;right:-6px;top:-22px;font:800 120px/1 Unbounded,sans-serif;color:var(--cat-deep);letter-spacing:-.06em;transform:rotate(-8deg)}
.start a b{position:relative;font:700 16px/1.2 Unbounded,"PingFang SC",sans-serif;letter-spacing:-.01em}
.start a small{position:relative;font-size:12px;font-weight:700;margin-top:6px;opacity:.75}
.tsec{margin-top:40px}
.tsec>h2{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800;margin:0 0 4px}
.tsec>h2 i{width:14px;height:14px;border-radius:50%;background:var(--cat)}
.tsec>h2 em{font:600 14px/1 -apple-system,sans-serif;font-style:normal;color:var(--ink-2);margin-left:auto}
.alist{list-style:none;margin:0;padding:0}
.alist a{display:block;padding:14px 0 14px 18px;border-top:1px solid var(--line);text-decoration:none;position:relative}
.alist a::before{content:"";position:absolute;left:0;top:16px;bottom:16px;width:5px;border-radius:3px;background:var(--cat)}
.alist b{display:block;font-size:17px;line-height:1.3}
.alist span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:15px;line-height:1.4;color:var(--ink-2);margin-top:3px}
.alist li:last-child a{border-bottom:1px solid var(--line)}
/* v=mix: lead card per topic + slim title rows + "See all" */
.tsec .leadl{list-style:none;margin:12px 0 4px;padding:0}
.lead{position:relative;overflow:hidden;contain:paint;display:flex;flex-direction:column;justify-content:flex-end;min-height:150px;border-radius:20px;padding:16px;background:var(--cat);color:#1f1410;text-decoration:none}
.lead .n{position:absolute;right:-.02em;top:-.34em;font:800 170px/1 Unbounded,sans-serif;color:var(--cat-deep);letter-spacing:-.06em;transform:rotate(-8deg)}
.lead b{position:relative;font:700 19px/1.2 Unbounded,"PingFang SC",sans-serif;letter-spacing:-.01em;max-width:88%}

<script>
const ROOT = "../";
const P = new URLSearchParams(location.search);
const S = { page: "calc", lang: "en", theme: "light", fold: "0", v: "mix", v404: "poster", sent: "0", path: "/recipes/easy-weed-brownies-recipe/", art: "sleep", ahead: "plain" };
for (const k in S) if (P.has(k)) S[k] = P.get(k);
if (P.has("shot")) document.body.classList.add("shot");

const EFF = 0.8;
const mgOf = (x) => (10 * x.g * x.s * EFF) / x.n;
const LEVELS = [["microdose", 0, 2.5, "#8fd6a9"], ["beginner", 2.5, 5, "#5cc48a"], ["casual", 5, 15, "#f4c542"], ["experienced", 15, 30, "#f29a42"], ["high", 30, 50, "#f27242"], ["extreme", 50, 80, "#d9412b"]];
const RANGES = ["1–2.5 mg", "2.5–5 mg", "5–15 mg", "15–30 mg", "30–50 mg", "50+ mg"];
const lvlIdx = (mg) => { const i = LEVELS.findIndex((l) => mg <= l[2]); return i < 0 ? 5 : i; };
const FRACS = [[1 / 2, "½", "半"], [1 / 3, "⅓", "三分之一"], [1 / 4, "¼", "四分之一"], [1 / 6, "⅙", "六分之一"], [1 / 8, "⅛", "八分之一"], [1 / 10, "1/10", "十分之一"], [1 / 12, "1/12", "十二分之一"]];
const fiveMg = (mg) => { if (mg <= 5) return { one: true }; const f = FRACS.find(([v]) => v <= 5 / mg); return f ? { f: S.lang === "zh" ? f[2] : f[1], mg: mg * f[0] } : { tooStrong: true }; };
const LIM = { g: [0.1, 28, 0.5], s: [1, 99, 1], n: [1, 200, 1] };
const clamp = (k, v) => Math.min(LIM[k][1], Math.max(LIM[k][0], v));

let D = null;
async function load(L) {
  const j = (p) => fetch(p).then((r) => r.json());
  const txt = (p) => fetch(p).then((r) => r.text());
  const [rec, ui, tr, glyph, sprite, artHTML] = await Promise.all([j(ROOT + "data/recipes.json"), j(`${ROOT}i18n/${L}.json`), L === "en" ? null : j(`${ROOT}i18n/recipes_${L}.json`),
    j("glyphs.json"), txt("sprite.svg"), txt(L === "en" ? ROOT + "articles.html" : `${ROOT}${L}/articles.html`)]);
  document.getElementById("sprite").innerHTML = sprite;
  // the articles index is parsed from the real (current) articles.html of that language
  const doc = new DOMParser().parseFromString(artHTML, "text/html");
  const arts = [...doc.querySelectorAll("a.article-card")].map((a) => { const lab = a.querySelector(".card-category")?.textContent.trim() || "";
    return { href: a.getAttribute("href"), slug: a.getAttribute("href").replace(/^.*\/|\.html$/g, ""), label: lab, topic: TOPIC[lab] ? lab : TOPIC_ALIAS[lab] || "Guides", title: a.querySelector("h2")?.textContent.trim(), ex: a.querySelector("p")?.textContent.trim() || "" }; });
  D = { rec, ui, tr, glyph, c: ui.calculator, faq: ui.faq, arts, lang: L };
}
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const nf = (v, d) => new Intl.NumberFormat(S.lang === "zh" ? "zh-CN" : S.lang, { maximumFractionDigits: d }).format(v);
const fmtMg = (mg) => nf(mg, mg >= 10 ? 0 : 1);
const fmtG = (g) => nf(g, g < 1 ? 2 : 1);
const parse = (s) => parseFloat(String(s).replace(",", "."));
const pre = () => (S.lang === "en" ? "" : "/" + S.lang);
const t = () => T[S.lang];
const nameOf = (slug) => D.tr?.[slug]?.name || D.rec.recipes.find((r) => r.slug === slug).name;
function seed(slug) { let h = 2166136261; for (const c of slug) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return (n) => ((h = Math.imul(h ^ (h >>> 15), 2246822507) ^ n) >>> 0) / 4294967296; }
const place = (slug) => { const r = seed(slug); return { gs: `${90 + r(1) * 14}%`, gx: `${-12 - r(2) * 16}%`, gy: `${-12 - r(3) * 16}%`, gr: `${-20 + r(4) * 30}deg` }; };
const vars = (cat, pl = {}) => { const [c, d, cd, dd] = CAT[cat]; return `--cat-lt:${c};--deep-lt:${d};--cat-dk:${cd};--deep-dk:${dd};` + Object.entries(pl).map(([k, v]) => `--${k}:${v}`).join(";"); };
const cover = (slug, cat, inner = "") => `<span class="cv" style="${vars(cat, place(slug))}" aria-hidden="true"><svg viewBox="0 0 100 100"><use href="#g-${D.glyph[slug] || "bowl"}"/></svg>${inner}</span>`;
function card(r) {
  const mg = (10 * r.suggested_quantity * 14 * EFF) / r.suggested_portion;
  return `<a class="card" href="${pre()}/recipes/${r.slug}/">${cover(r.slug, r.category_name, `<span class="dot" title="${fmtMg(mg)} mg THC ${t().per}"><b>${fmtMg(mg)}</b><small>mg</small></span>`)}<span class="nm">${esc(nameOf(r.slug))}</span></a>`;
}
const R = (slug) => D.rec.recipes.find((r) => r.slug === slug);
// band: colour block + oversized cropped typographic mark (the non-recipe "cover")
const band = (cat, mark, inner, cls = "", mk = {}) => `<header class="band ${cls}" style="${vars(cat, mk)}"><span class="mk" aria-hidden="true">${mark}</span>${inner}</header>`;

function guess(path) {
  const words = decodeURIComponent(path).toLowerCase().split(/[^a-z0-9À-ɏ一-鿿]+/).filter((w) => w.length > 2 && !STOP.has(w) && !/^\d+$/.test(w));
  const stem = (w) => w.replace(/(ies)$/, "y").replace(/(es|s)$/, "");
  const ws = [...new Set(words.map(stem))];
  if (!ws.length) return { words: [], hits: [] };
  const hits = D.rec.recipes.map((r) => { const hay = (r.slug + " " + r.name + " " + (D.tr?.[r.slug]?.name || "")).toLowerCase().split(/[^a-z0-9À-ɏ一-鿿]+/).filter((h) => h.length > 2).map(stem);
    return [ws.filter((w) => hay.some((h) => h === w || (w.length > 3 && (h.startsWith(w) || w.startsWith(h))))).length, r]; }).filter(([s]) => s > 0).sort((a, b) => b[0] - a[0] || a[1].slug.length - b[1].slug.length).slice(0, 4).map((p) => p[1]);
  return { words, hits };
}

  ART = { key, slug, label, topic: TOPIC[label] ? label : TOPIC_ALIAS[label] || "Guides", h1: hero.querySelector("h1").textContent.trim(),
    meta: [...hero.querySelectorAll(".article-meta span")].map((s) => s.innerHTML.trim()), ex: hero.querySelector(".article-excerpt")?.textContent.trim() || "",
    body: doc.querySelector("article.article-body").outerHTML };
}
function pageArticle() {
  const a = ART, n = NEXT[S.lang], cat = TOPIC[a.topic], arts = `${pre()}/articles.html`;
  const byline = `<p class="byline">${a.meta.map((m) => `<span>${m}</span>`).join("")}</p>`;
  const head = S.ahead === "band"
    ? band(cat, esc(a.h1.trim()[0]), `<a class="eyebrow" href="${arts}">${esc(a.label)}</a><h1>${esc(a.h1)}</h1><p class="deck">${esc(a.ex)}</p>${byline}`, "", { ms: "300px", my: "-.26em", mx: "-.02em", mr: "-8deg" })
    : `<header class="ahead tone" style="${vars(cat)}"><nav class="crumbs" aria-label="Breadcrumb"><a href="${arts}">${n.arts}</a><span aria-hidden="true">›</span><a class="tag" href="${arts}">${esc(a.label)}</a></nav><h1>${esc(a.h1)}</h1><p class="lede">${esc(a.ex)}</p>${byline}</header>`;
  const next = `<a class="calcta" href="${pre()}/calculator.html"><b>${n.q}</b><span>${n.s}</span><span class="go">${I.calc}</span></a>
    <section class="block"><div class="bh"><h2>${n.first}</h2><a href="${pre()}/" style="font-weight:700">${t().allR} →</a></div><div class="grid g4">${["cannabutter", "pot-brownies", "gummy-bears", "pot-cookies"].map(R).map(card).join("")}</div></section>`;
  return `<div class="col">${head}${a.body}${next}</div>`;
}

// ================= donate.html (en/pt/es/de/zh exist) =================
const FREE = { en: "free", pt: "grátis", de: "gratis", zh: "免费" };
function pageDonate() {
  const d = D.ui.donate;
  const head = band("Vegan", FREE[S.lang], `<span class="eyebrow">${t().moreL[3]}</span><h1>${esc(d.heading)}</h1><p class="deck">${esc(d.subtitle)}</p>`, "", { ms: "190px", my: "-.22em", mx: "-.06em", mr: "-8deg" });
  const L = { en: ["Recipes", "Guides", "Calculator"], pt: ["Receitas", "Guias", "Calculadora"], de: ["Rezepte", "Ratgeber", "Rechner"], zh: ["食谱", "指南", "计算器"] }[S.lang];
  return head + `<div class="col">
    <div class="facts"><div><b>${D.rec.recipes.length}</b><span>${L[0]}</span></div><div><b>${D.arts.length}</b><span>${L[1]}</span></div><div><b>1</b><span>${L[2]}</span></div></div>
    <div class="prose" style="margin-top:26px"><p>${esc(d.paragraph_1)}</p><p>${esc(d.paragraph_2)}</p></div>
    <a class="btn pri paypal" href="https://bit.ly/donateht" target="_blank" rel="noopener noreferrer">${esc(d.donate_btn)} ${I.arr}</a>
    <p class="thanks">${esc(d.thank_you)}</p></div>`;
}

// ---------- live update for the calculator (never re-renders the inputs) ----------
function liveAll() {
  if (S.page !== "calc") return measure();
  const mg = mgOf(x), cur = lvlIdx(mg);
  document.getElementById("live").innerHTML = liveHTML(mg);
  document.getElementById("peek").innerHTML = peekHTML(mg);
  document.getElementById("peek").style.setProperty("--lc", LEVELS[cur][3]);
  document.querySelectorAll("[data-o=eq]").forEach((el) => (el.innerHTML = yourEq()));
  document.querySelectorAll(".dt tr[data-lvl]").forEach((tr) => { const on = +tr.dataset.lvl === cur; tr.toggleAttribute("aria-current", on); const td = tr.firstElementChild, you = td.querySelector(".you");
    if (on && !you) td.insertAdjacentHTML("beforeend", `<span class="you">${t().you}</span>`); if (!on && you) you.remove(); });
  document.querySelectorAll("[data-unit=n]").forEach((el) => (el.textContent = t().serv(x.n)));
  document.querySelectorAll("[data-in]").forEach((i) => { if (i !== document.activeElement) i.value = i.dataset.in === "g" ? fmtG(x.g) : nf(x[i.dataset.in], 1); });
  document.querySelectorAll(".chip[data-k]").forEach((b) => b.setAttribute("aria-pressed", x[b.dataset.k] === +b.dataset.v));
  document.querySelector("[data-reset]").hidden = x.g === DEF.g && x.s === DEF.s && x.n === DEF.n;
  measure();
}
function measure() {
  const y = (el) => (el ? Math.round(el.getBoundingClientRect().top + scrollY) : null), hgt = (el) => (el ? Math.round(el.getBoundingClientRect().height) : null);
  const b = document.querySelector(".band"), res = document.getElementById("live"), mgEl = document.querySelector(".big .mg");
  window.__m = { vw: innerWidth, vh: innerHeight, bandBottom: b ? y(b) + hgt(b) : null, mgBottom: mgEl ? y(mgEl) + hgt(mgEl) : null, panelBottom: res ? y(res) + hgt(res) : null, page: document.documentElement.scrollHeight,
    firstCard: y(document.querySelector(".card")), firstRow: y(document.querySelector("#alist li")), takeaway: y(document.querySelector(".article-takeaway")) };
  const m = document.querySelector("#bar .m"); if (!m) return; const M = window.__m;
  m.textContent = `${M.vw}×${M.vh} · band ends ${M.bandBottom}px` + (M.mgBottom ? ` · mg/serving visible at ${M.mgBottom}px ${M.mgBottom <= 664 ? "≤" : ">"} 664 · result panel ends ${M.panelBottom}px` : "") + (M.firstRow ? ` · first article row ${M.firstRow}px` : "") + (S.page === "404" ? ` · first suggestion ${M.firstCard}px` : "") + (M.takeaway ? ` · short answer starts ${M.takeaway}px` : "") + ` · page ${M.page}px`;
}

// ---------- toolbar ----------
function bar() {
  const b = (k, v, l, dis) => `<button data-set="${k}" data-v="${v}" aria-pressed="${S[k] === v}"${dis ? " disabled" : ""}>${l}</button>`, en = EN_ONLY.includes(S.page);
  return `<div class="grp">${b("page", "calc", "Calculator")}${b("page", "articles", "Articles index")}${b("page", "contact", "Contact")}${b("page", "404", "404")}${b("page", "about", "About")}${b("page", "article", "Article")}${b("page", "donate", "Donate")}</div>
    <div class="grp">${b("lang", "en", "EN")}${b("lang", "pt", "PT", en)}${b("lang", "de", "DE", en)}${b("lang", "zh", "中文", en)}</div>
    <div class="grp">${b("theme", "light", "☀")}${b("theme", "dark", "☾")}${b("fold", "1", "Fold")}</div>
    ${S.page === "articles" ? `<div class="grp"><i>index</i>${b("v", "mix", "cards + slim list ✓")}${b("v", "list", "list")}${b("v", "cards", "cards")}</div>` : ""}
    ${S.page === "404" ? `<div class="grp"><i>404</i>${b("v404", "poster", "poster ✓")}${b("v404", "art", "keep illustration")}</div><div class="grp"><i>URL</i>${b("path", "/recipes/easy-weed-brownies-recipe/", "brownies")}${b("path", "/pt/recipes/manteiga-de-cannabis/", "pt butter")}${b("path", "/drinks/weed-lemonade", "old Rails")}${b("path", "/asdfgh", "nothing")}</div>` : ""}
    ${S.page === "article" ? `<div class="grp"><i>article</i>${b("art", "sleep", "sleep")}${b("art", "kickin", "table")}${b("art", "badtrip", "bad trip")}${b("art", "topicals", "steps")}</div><div class="grp"><i>title</i>${b("ahead", "plain", "shell + type ✓")}${b("ahead", "band", "topic band")}</div>` : ""}
    ${S.page === "contact" ? `<div class="grp"><i>state</i>${b("sent", "0", "form")}${b("sent", "1", "sent")}</div>` : ""}
    <div class="grp min"><button data-min>▾</button></div><div class="m"></div>`;
}
async function render() {
  if (EN_ONLY.includes(S.page)) S.lang = "en";
  if (S.page === "404") { const m = /^\/(pt|es|de|zh)\//.exec(S.path); if (m && T[m[1]]) S.lang = m[1]; } // the one 404 picks its language from the URL
  if (!D || D.lang !== S.lang) await load(S.lang);
  if (S.page === "article") await loadArticle();
  x = { ...DEF };
  document.documentElement.lang = S.lang === "zh" ? "zh-Hans" : S.lang;
  document.documentElement.dataset.theme = S.theme;
  const pg = { calc: pageCalc, articles: pageArticles, contact: pageContact, 404: page404, about: pageAbout, article: pageArticle, donate: pageDonate }[S.page] || pageCalc;
  document.getElementById("app").innerHTML = shell(pg());
  history.replaceState(null, "", "?" + new URLSearchParams({ ...S, ...(P.has("shot") ? { shot: 1 } : {}) }));
  document.getElementById("bar").innerHTML = bar();
  liveAll();
  if (P.get("mini") === "1") document.body.classList.add("mini-on");
  if (P.has("scroll")) { await document.fonts.ready; const el = document.getElementById(P.get("scroll")); scrollTo({ top: el.getBoundingClientRect().top + scrollY + +(P.get("dy") || 0), behavior: "instant" }); onScroll(true); }
}

// compact bar on scroll-up (navigation ticket) + the 56px peek once the big panel has scrolled away (recipe-final)
let lastY = scrollY;
function onScroll(force) {
  const y = scrollY;
  if (P.get("mini") !== "1" && (force === true || Math.abs(y - lastY) > 6)) { document.body.classList.toggle("mini-on", y > 140 && y < lastY); lastY = y; }
  const card = document.getElementById("calc");
  if (card && innerWidth < 1000) { const r = card.getBoundingClientRect(), rt = parseFloat(getComputedStyle(document.body).getPropertyValue("--res-top")) || 0;
    card.classList.toggle("peeking", document.getElementById("live").getBoundingClientRect().bottom < rt + 56 && r.bottom > rt + 120); }
}
addEventListener("scroll", onScroll, { passive: true });
addEventListener("resize", () => D && measure());

function setK(k, v) { if (!isFinite(v)) return; x[k] = k === "n" ? Math.round(clamp(k, v)) : Math.round(clamp(k, v) * 100) / 100; liveAll(); }
document.addEventListener("input", (e) => { const k = e.target.dataset.in; if (k) { const v = parse(e.target.value); if (v > 0) setK(k, v); } if (e.target.id === "aq") filterArticles(); });
document.addEventListener("change", (e) => { if (e.target.dataset.in) { e.target.blur(); liveAll(); } });
document.addEventListener("click", (e) => {
  const set = e.target.closest("[data-set]"); if (set) { const k = set.dataset.set; S[k] = k === "fold" && S.fold === "1" ? "0" : set.dataset.v; return render(); }
  if (e.target.closest("[data-min]")) return document.body.classList.toggle("barmin");
  const st = e.target.closest("[data-step]"); if (st) { const k = st.dataset.step, step = LIM[k][2] * +st.dataset.d; return setK(k, k === "g" ? Math.round((x.g + step) / LIM.g[2]) * LIM.g[2] || LIM.g[0] : x[k] + step); }
  const ch = e.target.closest(".chip[data-k]"); if (ch) return setK(ch.dataset.k, +ch.dataset.v);
  if (e.target.closest("[data-reset]")) { x = { ...DEF }; return liveAll(); }
  const tp = e.target.closest(".chip[data-topic]"); if (tp) { document.querySelectorAll(".topics .chip").forEach((c) => c.setAttribute("aria-pressed", c === tp)); return filterArticles(); }
  const pk = e.target.closest("[data-pick]"); if (pk) { const r = document.querySelector(`input[name=subject][value="${pk.dataset.pick}"]`); if (r) r.checked = true; }
});
render().then(() => document.fonts.ready).then(() => measure());
</script>
